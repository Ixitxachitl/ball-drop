  }
  function drawFireworks() {
    for (const s of FW.shells) if (s.wait <= 0) {
      px(Math.round(s.x), Math.round(s.y), '#fff3a8');
      ctx.globalAlpha = 0.4; px(Math.round(s.x), Math.round(s.y) + 1, '#ffd84a'); px(Math.round(s.x), Math.round(s.y) + 2, '#ff8a20'); ctx.globalAlpha = 1;
    }
    for (const q of FW.sparks) {
      if (q.l < 0.35 && Math.random() < 0.4) continue;
      ctx.globalAlpha = Math.min(1, q.l / 0.6); px(Math.round(q.x), Math.round(q.y), q.c);
    }
    ctx.globalAlpha = 1;
  }

  // ---- casino & pinball art ----
  const PIPS = { 1: [[3, 3]], 2: [[1, 1], [5, 5]], 3: [[1, 1], [3, 3], [5, 5]], 4: [[1, 1], [5, 1], [1, 5], [5, 5]],
    5: [[1, 1], [5, 1], [3, 3], [1, 5], [5, 5]], 6: [[1, 1], [5, 1], [1, 3], [5, 3], [1, 5], [5, 5]] };
  function drawDie(x, y, face) {
    for (let j = 0; j < 7; j++) for (let i = 0; i < 7; i++) {
      if ((i === 0 || i === 6) && (j === 0 || j === 6)) continue;
      px(x + i, y + j, i === 6 || j === 6 ? '#c9c4dc' : '#fffaf0');
    }
    for (const [i, j] of PIPS[face]) px(x + i, y + j, face === 1 ? '#e8344e' : '#1f1830');
  }
  const SPR = {
    seven:   ['rrrrr', '...r.', '..r..', '.r...', '.r...'],
    cherry:  ['...g.', '..gg.', '.g..g', 'rr.rr', 'rr.rr'],
    bell:    ['..y..', '.yyy.', '.yyy.', 'yyyyy', '..y..'],
    diamond: ['..r..', '.rrr.', 'rrrrr', '.rrr.', '..r..'],
    heart:   ['rr.rr', 'rrrrr', 'rrrrr', '.rrr.', '..r..'],
    spade:   ['..w..', '.www.', 'wwwww', 'wwwww', '..w..', '.www.'],
    ball:    ['.sss.', 'swsss', 'sssss', 'sssSs', '.SSS.'],
  };
  const SPR_C = { r: '#ff3b5c', w: '#f4f0ff', g: '#2fd06a', y: '#ffd84a', s: '#c9c8d8', S: '#8a8aa0' };
  function sprite(rows, x, y) {
    rows.forEach((row, j) => { for (let i = 0; i < row.length; i++) if (row[i] !== '.') px(x + i, y + j, SPR_C[row[i]]); });
  }
  // spinning discs: poker chips (main, edge, middle colors) and coins, squashed sideways as they turn
  function drawDisc(cx, cy, r, sx, cols) {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      const e = (dx / (r * sx + 0.35)) ** 2 + (dy / (r + 0.35)) ** 2;
      if (e > 1) continue;
      px(cx + dx, cy + dy, e > 0.55 ? ((dx + dy) & 1 ? cols[1] : cols[0]) : e > 0.2 ? cols[0] : cols[2]);
    }
  }
  // a pop bumper: red rim, white band, red top; flashes yellow when hit
  function drawBumper(x, y, r, lit) {
    for (let dy = -r - 1; dy <= r + 1; dy++) for (let dx = -r - 1; dx <= r + 1; dx++) {
      const d = Math.hypot(dx, dy);
      if (d > r + 0.5) continue;
      px(x + dx, y + dy, d > r - 0.9 ? (lit ? '#ffe600' : '#3ff8ff') : d > r - 2 ? '#fffaf0' : lit ? '#fff' : '#ff3bd0');
    }
    if (lit) for (let k = 0; k < 8; k++) { const a = k / 8 * 6.283; px(Math.round(x + Math.cos(a) * (r + 2)), Math.round(y + Math.sin(a) * (r + 2)), '#fff3a8'); }
  }

  function drawHops() {
    for (const h of K.hops) {
      const x = Math.round(h.x - h.hw / 2), base = Math.round(h.fy);
      if (h.kind === 'die') drawDie(x, base - 7, h.face);
      else if (h.kind === 'chips') {
        // poker chips side-on, lit from the front left, white inlays in their edges, the top one's face catching the light
        const SH = [-0.5, -0.15, 0.12, 0.28, 0.22, 0.05, -0.2, -0.5];
        h.cols.forEach(([main], i) => {
          const y = base - 2 - 2 * i;
          for (let j = 0; j < h.hw; j++) {
            const inlay = j === 2 || j === 5;
            px(x + j, y, shade(inlay ? '#f4f0ff' : main, SH[j])); px(x + j, y + 1, shade(inlay ? '#cfc8e0' : main, SH[j] - 0.25));
          }
        });
        const face = h.cols[h.cols.length - 1][0];
        for (let j = 1; j < h.hw - 1; j++) px(x + j, base - 1 - 2 * h.cols.length, shade(face, j === 1 || j === h.hw - 2 ? 0.15 : 0.4));
      } else if (h.kind === 'mush') {
        // a mushroom pop bumper on a post
        const lit = h.lit > 0, bx = Math.round(h.x), by = base - 5;
        for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
          const d = Math.hypot(dx, dy);
          if (d > 4.4) continue;
          px(bx + dx, by + dy, d > 3.2 ? (lit ? '#ffe600' : '#ff3b5c') : d > 2 ? '#fffaf0' : lit ? '#fff' : '#ff3b5c');
        }
        ctx.fillStyle = '#4a4660'; ctx.fillRect(bx - 2, base - 1, 5, 1);
      } else {
        // a pinball slingshot: a triangle of rubber leaning the way it kicks
        const kx = Math.round(h.x), lit = h.lit > 0, tip = [kx + h.f * 4, base - 9];
        for (let i = 0; i <= 10; i++) {
          const t = i / 10;
          for (const [ax, ay] of [[kx - 4, base - 1], [kx + 4, base - 1]]) px(Math.round(ax + (tip[0] - ax) * t), Math.round(ay + (tip[1] - ay) * t), lit ? '#ffe600' : '#ff3b5c');
        }
        ctx.fillStyle = lit ? '#fff3a8' : '#2a2236'; ctx.fillRect(kx - 3, base - 3, 7, 2);
        ctx.fillStyle = '#c9c8d8'; ctx.fillRect(kx - 4, base - 1, 9, 1);
        px(tip[0], tip[1], '#3ff8ff');
      }
    }
  }

  // Overlays on the track: boost pads, conveyor belts, springs and trapdoors, and the starting shelf.
  function drawMarks(t) {
    for (const s of K.segs) {
      if (!s.sp || !(s.boost || s.belt || s.spring || s.trap)) continue;
      const x0 = Math.round(s.ax), x1 = Math.round(s.bx), yy = x => Math.round(s.ay + (s.by - s.ay) * (x + 0.5 - s.ax) / (s.bx - s.ax));
      if (s.boost) {
        for (let x = x0; x < x1; x++) for (let row = 0; row < 2; row++) {
          const ph = (((x * s.flow - row - t * 18) % 6) + 6) % 6;   // (slowly: fast stripes flicker)
          px(x, yy(x) + row, ph < 3 ? C.boostA : C.boostB);
        }
        for (let x = x0; x < x1; x += 3) px(x, yy(x) - 1, 'rgba(63,248,255,0.35)');
      } else if (s.belt) {
        // a conveyor: a dark belt with its treads creeping along, rollers at each end
        for (let x = x0; x < x1; x++) {
          const y = yy(x), ph = (((x - t * s.belt * s.flow * 0.25) % 4) + 4) % 4;
          px(x, y, ph < 2 ? '#e8e6f4' : '#3a2c40'); px(x, y + 1, '#2a1c30');
        }
        for (const x of [x0, x1 - 1]) { const y = yy(x); ctx.fillStyle = '#5a5470'; ctx.fillRect(x - 1, y + 1, 3, 3); px(x, y + 2, '#ffd84a'); }
      } else if (s.spring) {
        const e = Math.round(s.anim * 6), w = x1 - x0, y = yy((x0 + x1) / 2);
        ctx.fillStyle = C.padDark; ctx.fillRect(x0, y - 1, w, 1);
        for (let i = 0; i < e; i++) px(x0 + 2 + (i & 1) * (w - 5), y - 2 - i, C.coil);
        ctx.fillStyle = C.pad; ctx.fillRect(x0, y - 3 - e, w, 1);
        ctx.fillStyle = C.padDark; ctx.fillRect(x0, y - 2 - e, w, 1);
      } else if (s.trap) {
        // a hatch: hazard-striped while it's shut; open, its two leaves hang down from the edges of the hole
        const T = s.trap, a = T.ang * Math.PI / 2 * 0.95, half = (x1 - x0) / 2;
        for (const [hx, dir] of [[x0, 1], [x1, -1]]) {
          const hy = yy(hx === x1 ? x1 - 1 : hx);
          for (let i = 0; i < half; i++) {
            const lx = Math.round(hx + dir * Math.cos(a) * i), ly = Math.round(hy + Math.sin(a) * i);
            const c = ((i >> 1) & 1) ? '#ffd84a' : '#2a2236';
            px(lx, ly, c); px(lx, ly + 1, '#5a5470');
          }
        }
      }
    }
    // the starting shelf: a checkered start line of slats that swing down when the race starts, and fold
    // away a moment later
    const fold = K.doorsOpen ? clamp(1 - (simT - K.openT - 1.2) / 0.6, 0, 1) : 1;
    if (fold > 0) ctx.globalAlpha = fold;
    for (const s of K.slats) {
      if (!fold) break;
      const a = K.doorAng * Math.PI / 2 * 0.95, len = s.bx - s.ax;
      for (let i = 0; i < len; i++) {
        const x = Math.round(s.ax + Math.cos(a) * i), y = Math.round(s.ay + Math.sin(a) * i);
        px(x, y, ((Math.floor(i / 2) + (i < 0 ? 1 : 0)) & 1) ? '#fffaf0' : '#1f1830');
        px(x, y + 1, ((Math.floor(i / 2) + 1) & 1) ? '#fffaf0' : '#1f1830');
        px(x, y + 2, C.shade);
      }
    }
    ctx.globalAlpha = 1;
  }

  // A loop: a ring of track standing on the floor, with a roulette wheel turning inside some of them.
  function drawLoops(t) {
    for (const b of K.bands) for (const L of b.loops) {
      const cx = L.x, cy = L.y0 - L.R;
      if (L.roulette) drawRoulette(Math.round(cx), Math.round(cy), Math.max(4, L.R - 2 * RW - 1), t);
      const cols = [C.top, C.body, C.dark, C.shade], steps = Math.ceil(2 * Math.PI * (L.R + 3) * 1.6);
      for (let k = 3; k >= 0; k--) {
        const rr = L.R + k;
        for (let i = 0; i <= steps; i++) {
          const th = i / steps * Math.PI * 2;
          let c = cols[k];
          if (L.roulette) {
            const sg = Math.floor((((th + t * 0.5) / (2 * Math.PI)) % 1) * 18);
            c = k === 0 || k === 3 ? (k ? '#b8862a' : '#ffd84a') : sg === 0 ? '#1fae5b' : sg & 1 ? '#2a2236' : '#e8344e';
          }
          px(Math.round(cx + Math.sin(th) * rr), Math.round(cy + Math.cos(th) * rr), c);
        }
      }
    }
  }
  function drawRoulette(x0, y0, rd, t) {
    const rot = t * 1.3;
    for (let dy = -rd; dy <= rd; dy++) for (let dx = -rd; dx <= rd; dx++) {
      const d = Math.hypot(dx, dy);
      if (d > rd + 0.3) continue;
      let c;
      if (d > rd - 1.6) {
        const sg = Math.floor(((((Math.atan2(dy, dx) + rot) / (2 * Math.PI)) % 1) + 1) % 1 * 18);
        c = sg === 0 ? '#1fae5b' : sg & 1 ? '#231c30' : '#d8283e';
      } else if (d > rd - 2.6) c = '#e8b84a';
      else if (d > 2.2) c = d > rd - 4 ? '#5a3018' : '#7a4424';
      else c = d < 1 ? '#fff3a8' : '#ffd84a';
      px(x0 + dx, y0 + dy, c);
    }
    const ba = -t * 2.6;
    px(Math.round(x0 + Math.cos(ba) * (rd - 2)), Math.round(y0 + Math.sin(ba) * (rd - 2)), '#fff');
  }

  // The glass coin funnel: its far side behind the wheels ('back'), its near side in front ('front').
  function drawFunnels(side) {
    for (const b of K.bands) for (const F of b.funnels) {
      const back = side === 'back', glass = back ? 'rgba(150,220,255,0.35)' : 'rgba(200,240,255,0.55)', Hh = F.spoutY - F.rimY;
      const fy = k => F.rimY + k * Hh;
      for (const k of [0, 0.25, 0.5, 0.75]) {
        const r = F.R * (1 - k) + 1.5 * k, cy = fy(k), steps = Math.ceil(r * 4);
        for (let i = 0; i <= steps; i++) {
          const a = (back ? Math.PI : 0) + i / steps * Math.PI;
          ctx.fillStyle = k === 0 ? (back ? '#a8d8f0' : '#e0f6ff') : glass;
          ctx.fillRect(Math.round(F.x + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r * 0.3), 1, 1);
        }
      }
      if (back) continue;
      for (const s of [-1, 1]) for (let i = 0; i <= Hh; i++) {
        const k = i / Hh, r = F.R * (1 - k) + 1.5 * k;
        ctx.fillStyle = 'rgba(220,245,255,0.8)'; ctx.fillRect(Math.round(F.x + s * r), Math.round(fy(k)), 1, 1);
      }
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      for (let i = 2; i < Hh * 0.6; i += 3) ctx.fillRect(Math.round(F.x - (F.R * (1 - i / Hh)) * 0.6), Math.round(fy(i / Hh)), 1, 2);
    }
  }

  // A glass pipe: two clear walls following its path with a shine down one side, a brass collar where it
  // leaves the floor and where it lets wheels out. The wheels are drawn first, so they show inside it.
  function drawPipes() {
    for (const P of K.pipes) {
      const pts = P.path;
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1], b = pts[i], d = Math.hypot(b.x - a.x, b.y - a.y) || 1, nx = -(b.y - a.y) / d, ny = (b.x - a.x) / d;
        for (let s = 0; s < d; s += 0.8) {
          const x = a.x + (b.x - a.x) * s / d, y = a.y + (b.y - a.y) * s / d;
          ctx.fillStyle = 'rgba(200,240,255,0.10)'; ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
          ctx.fillStyle = 'rgba(210,245,255,0.6)';
          ctx.fillRect(Math.round(x + nx * (RW + 1.5)), Math.round(y + ny * (RW + 1.5)), 1, 1);
          ctx.fillRect(Math.round(x - nx * (RW + 1.5)), Math.round(y - ny * (RW + 1.5)), 1, 1);
          if ((i & 3) < 2) { ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillRect(Math.round(x + nx * (RW - 0.5)), Math.round(y + ny * (RW - 0.5)), 1, 1); }
        }
      }
      // the mouth: a dark slot in the floor with a brass rim
      const mx = Math.round(P.x), my = Math.round(P.y0);
      ctx.fillStyle = '#1f1830'; ctx.fillRect(mx - 4, my, 9, 1);
      ctx.fillStyle = '#e8b84a'; ctx.fillRect(mx - 5, my - 1, 1, 2); ctx.fillRect(mx + 5, my - 1, 1, 2);
      const e = pts[pts.length - 1];
      ctx.fillStyle = '#e8b84a'; ctx.fillRect(Math.round(e.x) - 1, Math.round(e.y) - RW - 2, 3, 1);
    }
  }

  // (a thick line from (x, y) at angle a, tapering: for flippers, bats and arms)
  function arm(x0, y0, a, len, th0, th1, c, hi) {
    const steep = Math.abs(Math.sin(a)) > Math.abs(Math.cos(a));
    for (let s = 0; s <= len; s += 0.7) {
      const x = Math.round(x0 + Math.cos(a) * s), y = Math.round(y0 + Math.sin(a) * s), th = Math.round(th0 + (th1 - th0) * s / len);
      ctx.fillStyle = c;
      if (steep) { ctx.fillRect(x - (th >> 1), y, th, 1); if (hi) px(x - (th >> 1), y, hi); }
      else { ctx.fillRect(x, y - (th >> 1), 1, th); if (hi) px(x, y - (th >> 1), hi); }
    }
  }
  function drawFlippers() {
    for (const F of K.flippers) {
      if (F.kind === 'bat') {
        ctx.fillStyle = '#5a5470'; ctx.fillRect(Math.round(F.px), Math.round(F.top), 1, Math.max(0, Math.round(F.py - F.top)));   // (the rod it hangs from)
        arm(F.px, F.py, F.ang, F.len - 3, 1, 1, '#c9c8d8');
        arm(F.px + Math.cos(F.ang) * (F.len - 3), F.py + Math.sin(F.ang) * (F.len - 3), F.ang, 3, 5, 5, '#ff9a1f', '#ffe08a');
      } else arm(F.px, F.py, F.ang, F.len, 4, 2, F.kind === 'catapult' ? '#3ff8ff' : '#ff3b5c', F.kind === 'catapult' ? '#c8ffff' : '#ffb3c1');
      ctx.fillStyle = '#e9e6ff'; ctx.fillRect(Math.round(F.px) - 1, Math.round(F.py) - 1, 3, 3); px(Math.round(F.px), Math.round(F.py), '#6a6488');
    }
  }
  // the windmills, see-saws, escalators, pusher bars, drums and rollers
  function drawMovers(t) {
    for (const E of K.escs) {
      // its side, the steps riding up it (the treads level, the risers moving), the landing and a handrail
      const n = Math.abs(E.x1 - E.x0), dir = Math.sign(E.x1 - E.x0);
      for (let i = 0; i <= Math.abs(E.x2 - E.x0); i++) {
        const x = E.x0 + dir * i, yt = i <= n ? E.y0 + (E.top - E.y0) * i / n : E.top, yb = yOn(E.sp, x);
        ctx.fillStyle = '#3a3450'; ctx.fillRect(Math.round(x), Math.round(yt) + 1, 1, Math.max(0, Math.round(yb - yt) - 1));
        const ph = ((i - t * 12) % 4 + 4) % 4;   // (the steps creeping up, gently)
        px(Math.round(x), Math.round(yt), i > n ? '#c8c8d8' : ph < 1 ? '#c8c8d8' : '#a8a8bc');
        if (i <= n + 3) px(Math.round(x), Math.round(yt) - 7, '#16121e');   // (the handrail)
      }
    }
    for (const M of K.movs) {
      if (M.type === 'spin') {
        for (let j = 0; j < M.n; j++) {
          const a = M.th + j * 6.283 / M.n, wide = M.n > 4;   // (a paddle wheel's arms end in paddles)
          arm(M.x, M.y, a, M.L, wide ? 1 : 2, wide ? 1 : 2, wide ? '#8a5a3a' : '#ffe600', wide ? null : '#fff3a8');
          if (wide) arm(M.x + Math.cos(a) * (M.L - 4), M.y + Math.sin(a) * (M.L - 4), a, 4, 3, 3, '#ff9a1f', '#ffe08a');
          else px(Math.round(M.x + Math.cos(a) * M.L), Math.round(M.y + Math.sin(a) * M.L), '#ff3bd0');
        }
        ctx.fillStyle = '#c9c8d8'; ctx.fillRect(Math.round(M.x) - 1, Math.round(M.y) - 1, 3, 3); px(Math.round(M.x), Math.round(M.y), '#ff3bd0');
      } else if (M.type === 'bridge') {
        // its posts, the hand rope sagging between them, and the planks
        const B = M.B, sag = x => Math.sin(Math.PI * (x - B.x0) / (B.x1 - B.x0));
        for (const x of [B.x0, B.x1]) { ctx.fillStyle = '#5a3a24'; ctx.fillRect(Math.round(x), Math.round(yOn(B.sp, x)) - 9, 1, 9); }
        for (let x = Math.ceil(B.x0); x <= B.x1; x++) {
          const y = yOn(B.sp, x) + B.D * sag(x);
          px(x, Math.round(y - 8 + B.D * 0.6 * sag(x)), '#c8a46a');   // (the rope)
          if ((x - Math.ceil(B.x0)) % 4 !== 3) { px(x, Math.round(y), '#c8955a'); px(x, Math.round(y) + 1, '#8a5a3a'); }   // (planks, with gaps)
        }
      } else if (M.type === 'pusher') {
        // the slot, and the bar while it's up
        for (let i = 0; i <= M.len; i++) { const x = M.x0 + M.f * i; px(Math.round(x), Math.round(yOn(M.sp, x)) - 1, '#16121e'); }
        if (M.bar.on) { ctx.fillStyle = '#3ff8ff'; ctx.fillRect(Math.round(M.bar.ax) - 1, Math.round(M.bar.by), 2, 7); px(Math.round(M.bar.ax) - 1, Math.round(M.bar.by), '#fff'); }
      } else if (M.type === 'saw') {
        // the fulcrum, then the plank
        const fy = yOn(M.sp, M.x);
        for (let dy = 0; dy <= fy - M.y; dy++) { ctx.fillStyle = '#5a5470'; ctx.fillRect(Math.round(M.x - dy * 0.8), Math.round(M.y + dy), Math.round(dy * 1.6) + 1, 1); }
        arm(M.x - Math.cos(M.a) * M.L / 2, M.y - Math.sin(M.a) * M.L / 2, M.a, M.L, 2, 2, '#8a5a3a', '#c8955a');
        if (M.skirt.on) { ctx.fillStyle = '#6a4028'; ctx.fillRect(Math.round(M.skirt.ax), Math.round(M.skirt.ay), 1, Math.round(M.skirt.by - M.skirt.ay)); }
      }
    }
    for (const c of K.drums) {
      // stripes going round as it spins
      const R = c.r, cx = Math.round(c.x), cy = Math.round(c.y);
      for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
        const d = Math.hypot(dx, dy); if (d > R + 0.3) continue;
        if (c.kind === 'hump' && cy + dy > yOn(c.sp, clamp(cx + dx, c.sp.xa, c.sp.xb)) - 0.5) continue;   // (only its top shows, over the track)
        const a = Math.atan2(dy, dx) - c.ang, st = ((a / 6.283 * (c.kind === 'drum' ? 8 : 4)) % 1 + 1) % 1;
        px(cx + dx, cy + dy, d > R - 0.8 ? '#1f1830' : c.kind === 'drum' ? (st < 0.5 ? '#ff3b5c' : '#fffaf0') : c.kind === 'hump' ? (st < 0.5 ? '#ff3bd0' : '#3ff8ff') : (st < 0.5 ? '#c8c8d8' : '#6a6488'));
      }
      if (c.kind !== 'hump') px(cx, cy, '#e8b84a');
    }
  }

  // Dominoes: a wheel that touches any one of a row tips it over, the way the wheel was going, and the rest
  // go down one after another away from it. Knocked at either end, the whole row falls one way; knocked in
  // the middle, it splits: those beyond it fall on away from it, and those before it fall back the other way.
  // Each comes to rest leaning on the next, and the one at the end of each run lies flat. This is how far
  // over domino i is (in radians, positive toward +x), for both views.
  function domAngle(D, i) {
    if (D.start < 0) return 0;
    const n = D.ds.length, f = clamp((simT - D.start - Math.abs(i - D.i0) * 0.06) / 0.12, 0, 1);
    const dir = i > D.i0 ? 1 : i < D.i0 ? -1 : D.d0;   // (+1: on toward the end of the row)
    const flat = dir > 0 ? i === n - 1 : i === 0;
    return f * (flat ? 1.5 : 0.95) * dir * D.f;
  }
  function knockDominoes(D, i, w) {
    const n = D.ds.length;
    D.start = simT; D.i0 = i;
    D.d0 = i === 0 ? 1 : i === n - 1 ? -1 : Math.sign(w.vx * D.f) || 1;
  }
  function drawDominoes() {
    for (const b of K.bands) for (const D of b.doms) {
      D.ds.forEach((dx0, i) => {
        const a = domAngle(D, i), ca = Math.cos(a), sa = Math.sin(a);
        for (let s = 0; s < 7; s++) {
          const xx = Math.round(dx0 + sa * s), yy = Math.round(D.ys[i] - 1 - ca * s);
          px(xx, yy, s === 1 || s === 3 || s === 5 ? '#1f1830' : '#fffaf0');
          px(xx + 1, yy, '#bdb6d0');
        }
      });
    }
  }

  // Traffic cones that go flying when a wheel clips them, and come back a few seconds later.
  const CONE = ['..o..', '..o..', '.www.', '.ooo.', 'wwwww', 'ooooo', 'kkkkkkk'];
  function drawCone(x, y, rot) {
    const ca = Math.cos(rot), sa = Math.sin(rot);
    CONE.forEach((row, j) => { for (let i = 0; i < row.length; i++) {
      if (row[i] === '.') continue;
      const dx = i - (row.length - 1) / 2, dy = j - 6;
      px(Math.round(x + dx * ca - dy * sa), Math.round(y + dx * sa + dy * ca), row[i] === 'o' ? '#ff7a1a' : row[i] === 'w' ? '#fffaf0' : '#2a2236');
    } });
  }
  function hitCone(c, w, f) {
    Object.assign(c, { hit: true, at: simT, fx: c.x, fy: c.y - 4, vx: f * (40 + rnd(0, 50)), vy: -rnd(90, 150), rot: 0, spin: f * rnd(8, 16) });
    emit(c.x, c.y - 3, 5, ['#ff7a1a', '#fff'], 30, 40, 160);
  }
  function drawCones() {
    for (const b of K.bands) for (const cs of b.cones) for (const c of cs.cs) {
      if (!c.hit) drawCone(Math.round(c.x), Math.round(c.y) - 1, 0);
      else if (c.fy < H + 10) drawCone(Math.round(c.fx), Math.round(c.fy), c.rot);
    }
  }

  // Lamp posts: an iron post with two curled arms holding glowing globes.
  const GLOW_PX = [];
  for (let dy = -7; dy <= 7; dy++) for (let dx = -7; dx <= 7; dx++) {
    const d = Math.hypot(dx, dy); if (d <= 7) GLOW_PX.push({ dx, dy, a: 0.22 * (1 - d / 7) ** 2 });
  }
  function drawLamps(t) {
    for (const L of K.lamps) {
      const x = L.x, y = L.y - 1, flick = 0.85 + 0.15 * Math.sin(t * 9 + x);
      for (const gx of [x - 3, x + 3]) for (const q of GLOW_PX) { ctx.globalAlpha = q.a * flick; px(gx + q.dx, y - 13 + q.dy, '#ffe9a0'); }
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#2a2236'; ctx.fillRect(x - 1, y - 1, 3, 2); ctx.fillRect(x, y - 15, 1, 15);
      ctx.fillStyle = '#4a4660'; ctx.fillRect(x - 1, y - 2, 3, 1); px(x, y - 8, '#4a4660');
      ctx.fillStyle = '#2a2236'; ctx.fillRect(x - 3, y - 16, 7, 1); px(x - 3, y - 15, '#2a2236'); px(x + 3, y - 15, '#2a2236');
      px(x, y - 17, '#ffd84a');
      for (const gx of [x - 3, x + 3]) { ctx.fillStyle = '#fff3c0'; ctx.fillRect(gx - 1, y - 14, 3, 3); px(gx, y - 13, '#ffffff'); px(gx - 1, y - 14, '#ffe9a0'); }
    }
  }

  // The slot machine cabinet (centred on x, standing behind the floor at `base`): a lit 777 topper, chasing
  // bulbs (faster after a jackpot), three reels with a payline, buttons, a coin tray and a lever.
  function drawSlots(t) {
    for (const S of K.slots) {
      const spinning = S.reels.some(r => r.until > simT), hot = simT - S.won < 3, x = S.x, top = S.base - 28;
      const chase = Math.floor(t * (hot ? 16 : 5));
      const rect = (c, a, b, w, h) => { ctx.fillStyle = c; ctx.fillRect(x + a, top + b, w, h); };
      ctx.globalAlpha = 0.85;
      rect('#c4203e', -15, 8, 31, 20); rect('#e04a5e', -15, 8, 2, 20); rect('#8e1530', 14, 8, 2, 20);
      rect('#d8d8e8', -15, 8, 31, 1);
      rect('#e8a020', -11, 0, 23, 1); rect('#e8a020', -12, 1, 25, 7); rect('#ffd84a', -11, 1, 23, 6);
      drawText('777', x, top + 1, '#e8344e');
      for (let i = 0; i < 12; i++) px(x - 11 + i * 2, top, (i + chase) % 3 ? '#fff3a8' : '#fff');
      for (let j = 0; j < 6; j++) {
        const on = (j + chase) & 1;
        px(x - 15, top + 10 + j * 3, on ? '#fff3a8' : '#ffd84a'); px(x + 15, top + 10 + j * 3, on ? '#ffd84a' : '#fff3a8');
      }
      rect('#2a2236', -12, 10, 25, 9);
      const REEL = ['#bdb4a0', '#e2dac6', '#fffaf0', '#fffaf0', '#fffaf0', '#e2dac6', '#bdb4a0'];
      S.reels.forEach((r, i) => {
        const rx = -11 + i * 8, spin = r.until > simT;
        REEL.forEach((c, j) => rect(c, rx, 11 + j, 7, 1));
        const s = spin ? SYMS[Math.floor(t * 14 + i * 2) % SYMS.length] : SYMS[r.s];
        sprite(SPR[s], x + rx + 1, top + 12 + (spin ? (Math.floor(t * 40) % 3) - 1 : 0));
      });
      rect('#ff3b5c', -13, 14, 1, 1); rect('#ff3b5c', 13, 14, 1, 1);
      if (hot && chase & 1) { ctx.fillStyle = 'rgba(255,216,74,0.35)'; ctx.fillRect(x - 12, top + 10, 25, 9); }
      for (const [c, bx] of [['#ff3b5c', -9], ['#ffd84a', -4], ['#2fd06a', 1]]) { rect(c, bx, 20, 3, 2); rect('#fff', bx, 20, 1, 1); }
      rect('#1f1830', -8, 23, 17, 3);
      for (let i = 0; i < (hot ? 7 : 2); i++) px(x - 6 + i * 2, top + 25, '#ffd84a');
      const kn = spinning ? 16 : 8;
      rect('#d8d8e8', 16, kn + 2, 1, 21 - kn); rect('#8a8aa0', 16, 21, 2, 2);
      rect('#ff3b5c', 16, kn, 2, 2);
      ctx.globalAlpha = 1;
    }
  }

  // The goal: a checkered banner on two poles over the last hole, and a checkered cup under it.
  function drawGoal(t, front) {
    const g = K.goal, a = Math.round(g.xa), b = Math.round(g.xb), y = Math.round(g.y);
    if (!front) {
      for (let yy = y + 1; yy < H; yy++) for (let x = a; x < b; x++) px(x, yy, ((x >> 1) + (yy >> 1)) & 1 ? 'rgba(255,250,240,0.55)' : 'rgba(31,24,48,0.55)');
      const glow = 0.25 + 0.15 * Math.sin(t * 4);
      ctx.fillStyle = `rgba(255,230,0,${glow})`; ctx.fillRect(a, y - 1, b - a, 2);
      return;
    }
    const top = y - 20;
    for (const x of [a - 2, b + 1]) { ctx.fillStyle = '#c9c8d8'; ctx.fillRect(x, top, 1, y - top + 3); px(x, top - 1, '#ffd84a'); }
    const bw = Math.max(b - a + 8, 21), bx = clamp(Math.round((a + b) / 2 - bw / 2), K.xl, K.xr - bw);
    for (let yy = 0; yy < 7; yy++) for (let x = 0; x < bw; x++) px(bx + x, top + 1 + yy, ((x >> 1) + (yy >> 1)) & 1 ? '#fffaf0' : '#1f1830');
    ctx.fillStyle = '#1f1830'; ctx.fillRect(bx + 1, top + 2, bw - 2, 5);
    drawText('GOAL', bx + bw / 2, top + 2, ((t * 3) | 0) & 1 ? '#ffe600' : '#fffaf0');
  }

  // ---- floating decorations, drifting slowly up behind the machine ----
  const DECOR = [];
  const DECOR_KINDS = ['die', 'chip', 'chip', 'coin', 'coin', 'heart', 'diamond', 'spade', 'seven', 'ball', 'star', 'star'];
  function newDecor(d, y) { Object.assign(d, { kind: pick(DECOR_KINDS), x: rnd(0, W), y, vy: -rnd(1.5, 4), ph: rnd(0, 6.3), face: ri(1, 6), chip: pick(CHIP_COLS) }); }
  function drawDecor(t, dt) {
    const n = Math.ceil(W * H / 3000);
    while (DECOR.length < n) { const d = {}; newDecor(d, rnd(0, H)); DECOR.push(d); }
    DECOR.length = n;
    ctx.globalAlpha = 0.3;
    for (const d of DECOR) {
      d.y += d.vy * dt;
      if (d.y < -10) newDecor(d, H + 8);
      const x = Math.round(d.x + Math.sin(t * 0.7 + d.ph) * 3), y = Math.round(d.y), spin = Math.cos(t * 1.6 + d.ph);
      if (d.kind === 'die') drawDie(x - 3, y - 3, 1 + (d.face + Math.floor(t / 0.9 + d.ph)) % 6);
      else if (d.kind === 'chip') drawDisc(x, y, 3, Math.abs(spin), [d.chip[0], '#f4f0ff', d.chip[1]]);
      else if (d.kind === 'coin') drawDisc(x, y, 2, Math.abs(spin), ['#ffd84a', '#e8a020', '#fff3a8']);
      else if (d.kind === 'star') {
        const s = (Math.sin(t * 2.5 + d.ph) + 1) / 2;
        px(x, y, '#fff');
        if (s > 0.35) for (const [a, b] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) px(x + a, y + b, '#fff3a8');
      } else sprite(SPR[d.kind], x - 2, y - 2);
    }
    ctx.globalAlpha = 1;
  }

  // ---- the wheels ----
  // At 9 px across, a hard-edged pixel circle looks boxy, so the edge pixels of the tire and the hubcap are
  // drawn as see-through as the circle is thin there (4 × 4 samples per pixel).
  const HUB_R = RW - 1.4;
  const cover = (dx, dy, r) => {
    let n = 0;
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) if (Math.hypot(dx - 0.375 + i / 4, dy - 0.375 + j / 4) <= r) n++;
    return n / 16;
  };
  const WHEEL_PX = [];
  for (let dy = -RW; dy <= RW; dy++) for (let dx = -RW; dx <= RW; dx++) {
    const o = cover(dx, dy, RW);
    if (o > 0) WHEEL_PX.push({ dx, dy, o, i: cover(dx, dy, HUB_R) });
  }
  const HALO_PX = [];
  for (let dy = -RW - 3; dy <= RW + 3; dy++) for (let dx = -RW - 3; dx <= RW + 3; dx++) {
    const d = Math.hypot(dx, dy);
    if (d > RW - 0.2 && d <= RW + 3.2) HALO_PX.push({ dx, dy, a: 0.42 * Math.pow(1 - (d - RW + 0.2) / 3.4, 1.5) });
  }
  function drawWheelAt(wx, wy, P, rot) {
    for (const q of WHEEL_PX) {
      ctx.globalAlpha = q.o; px(wx + q.dx, wy + q.dy, C.tire);
      if (q.i > 0) { ctx.globalAlpha = q.o * q.i; px(wx + q.dx, wy + q.dy, P.rim); }
    }
    ctx.globalAlpha = 1;
    for (const k of [0, Math.PI]) px(wx + Math.round(1.6 * Math.cos(rot + k)), wy + Math.round(1.6 * Math.sin(rot + k)), P.spoke);
    px(wx, wy, P.hub);
  }
  function drawWheel(w) {
    const wx = Math.round(w.x), wy = Math.round(w.y), P = w.pal, sp = Math.hypot(w.vx, w.vy);
    if (sp > 115 || w.boostT > 0 || w.mode === 'path' || w.mode === 'loop') {
      w.trail.forEach((q, i) => {
        ctx.globalAlpha = (i + 1) / w.trail.length * 0.6;
        ctx.fillStyle = i % 2 ? P.trailA : P.trailB;
        ctx.fillRect(Math.round(q.x), Math.round(q.y) - 1, 1, 3);
      });
      ctx.globalAlpha = 1;
    }
    for (const q of HALO_PX) { ctx.globalAlpha = q.a; px(wx + q.dx, wy + q.dy, P.main); }
    ctx.globalAlpha = 1;
    drawWheelAt(wx, wy, P, w.rot);
  }

  // ---------------- racers' colors ----------------
  function hash(str) {
    let h = 2166136261;
    for (const ch of str) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function hexToHsl(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return null;
    const n = parseInt(m[1], 16);
    const r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    let h = 0, s = 0; const l = (mx + mn) / 2;
    if (mx !== mn) {
      const d = mx - mn;
      s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
      h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h *= 60;
    }
    return [h, s * 100, l * 100];
  }
  const hsl = (h, s, l) => `hsl(${((h % 360) + 360) % 360},${s}%,${l}%)`;
  // Their chat color, kept bright enough to show up; chatters without one get a color of their own from their name.
  function riderPal(name, color) {
    let h, s, l;
    const fromHex = hexToHsl(color);
    if (fromHex) { [h, s, l] = fromHex; s = clamp(s, 55, 95); l = clamp(l, 52, 68); }
    else { const seed = hash(name.toLowerCase()); h = seed % 360; s = 78 + (seed >>> 9) % 18; l = 56 + (seed >>> 14) % 10; }
    const main = hsl(h, s, l);
    return { main, rim: main, spoke: hsl(h, s, 90), hub: hsl(h, s * .8, 30), trailA: main, trailB: hsl(h, s, 82) };
  }

  // ---------------- names and emote bubbles ----------------
  const root = document.documentElement;
  const PXS = clamp(Math.round(SCALE), 2, 6);   // bubble outline thickness: one machine pixel, within reason
  root.style.setProperty('--p', PXS + 'px');
  root.style.setProperty('--es', CFG.emotesize + 'px');
  const TAIL = PXS * 7;
  const DOTS = [[0.25, 2], [0.55, 1.5], [0.82, 1]].map(([at, k]) => ({ at, size: Math.round(PXS * k) }));

  // where a wheel is on screen (its middle, and the top of it), from whichever view is showing
  const screenOf = w => R3 ? R3.project(w) : { x: w.x * SCALE, y: w.y * SCALE, top: (w.y - RW) * SCALE, vis: true };

  // The names: always over each wheel, in its color with an ink outline. On the starting line they take
  // turns between two heights, so neighbours don't cover each other. (In 3D, where the starting pen's
  // seen in perspective, a name only goes up a level where it would cover another, and keeps its level
  // while it can, moving to a new one smoothly.)
  let namesT = performance.now();
  function liftNames3D(lined, ns) {
    const now = performance.now(), k = 1 - Math.exp(-(now - namesT) / 1000 * 8), placed = [];
    namesT = now;
    for (const w of live) {   // (in joining order)
      const p = w.scr = screenOf(w);
      let lv = 0;
      if (lined && p.vis) {
        const wd = uctx.measureText(w.name).width + 6;
        const free = l => !placed.some(q => q.lv === l && Math.abs(q.x - p.x) < (q.wd + wd) / 2 && Math.abs(q.top - p.top) < ns * 1.2);
        lv = w.nameLv != null && free(w.nameLv) && (w.nameLv === 0 || !free(0)) ? w.nameLv : 0;
        while (!free(lv)) lv++;
        placed.push({ x: p.x, top: p.top, wd, lv });
      }
      w.nameLv = lv;
      w.nameLift = (w.nameLift ?? 0) + (lv * (ns + 1) - (w.nameLift ?? 0)) * k;
    }
  }
  function drawNames() {
    uctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    uctx.clearRect(0, 0, innerWidth, innerHeight);
    const ns = CFG.namesize;
    uctx.font = `700 ${ns}px 'Pixelify Sans', system-ui, sans-serif`;
    uctx.textAlign = 'center'; uctx.textBaseline = 'alphabetic'; uctx.lineJoin = 'round';
    uctx.lineWidth = Math.max(3, ns / 3.5); uctx.strokeStyle = '#1f1830';
    const lined = state === 'lobby' || state === 'count', order = lined && !R3 ? [...live].sort((a, b) => a.x - b.x) : live;
    if (R3) liftNames3D(lined, ns);
    let i = 0;
    for (const w of order) {
      const lift = R3 ? w.nameLift : lined ? (i++ & 1) * (ns + 1) : 0, p = w.scr = R3 ? w.scr : screenOf(w);
      if (!p.vis) continue;
      const x = p.x, y = p.top - 4 - lift;
      w.ly = y - ns;   // (the top of the name, for the bubble to sit over)
      uctx.strokeText(w.name, x, y); uctx.fillStyle = w.pal.main; uctx.fillText(w.name, x, y);
    }
  }

  // Emote-only bubbles: the Twitch/Kick emotes in a message, and any emoji, with the words left out.
  const EMOJI = /\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic})*/gu;
  function emotesOf(tokens) {
    const out = [];
    for (const t of tokens) {
      if (t.t === 'emote') out.push(t);
      else for (const m of t.v.matchAll(EMOJI)) out.push({ t: 'emoji', v: m[0] });
    }
    return out.slice(0, 8);
  }
  function say(w, items) {
    if (!CFG.bubbles || SIM || w.mode === 'done') return;
    if (!w.bub) {
      w.bub = document.createElement('div'); w.bub.className = 'bub';
      w.dots = DOTS.map(d => {
        const el = document.createElement('div'); el.className = 'bub-dot';
        el.style.width = el.style.height = d.size + 'px';
        document.body.appendChild(el);
        return el;
      });
      document.body.appendChild(w.bub);
    }
    const b = w.bub;
    b.textContent = '';
    for (const it of items) {
      if (it.t === 'emote') {
        const img = new Image(); img.src = it.url; img.alt = it.code || '';
        img.onload = () => measure(w); img.onerror = () => { img.remove(); measure(w); };
        b.appendChild(img);
      } else { const s = document.createElement('span'); s.textContent = it.v; b.appendChild(s); }
    }
    w.sayUntil = performance.now() + Math.min(9000, 3000 + 400 * items.length) * CFG.hold;
    w.dots.forEach(el => el.classList.add('show'));
    b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
    measure(w); w.by = null;
  }
  function measure(w) { if (w.bub) { w.bw = w.bub.offsetWidth; w.bh = w.bub.offsetHeight; } }
  function removeBubble(w) {
    if (!w.bub) return;
    const els = [w.bub, ...w.dots];
    els.forEach(el => el.classList.remove('show'));
    setTimeout(() => els.forEach(el => el.remove()), 400);
    w.bub = null; w.dots = null;
  }
  // A bubble rides above its wheel's name, easing after it so it doesn't jitter, and its tail of shrinking
  // squares points down at the wheel.
  function placeBubbles(dt, now) {
    for (const w of live) {
      const b = w.bub;
      if (!b) continue;
      if (now > w.sayUntil) { b.classList.remove('show'); w.dots.forEach(el => el.classList.remove('show')); continue; }
      const p = w.scr || screenOf(w), hide = p.vis ? '' : 'hidden';
      b.style.visibility = hide; w.dots.forEach(el => el.style.visibility = hide);
      if (!p.vis) continue;
      const wx = p.x, wy = p.top - SCALE;
      const tx = wx - w.bw / 2, ty = (w.ly ?? wy) - 4 - TAIL - w.bh;
      if (w.by == null) { w.bx = tx; w.by = ty; }
      const k = Math.min(1, dt * 10);
      w.bx += (tx - w.bx) * k; w.by += (ty - w.by) * k;
      const left = clamp(w.bx, 4, innerWidth - w.bw - 4), top = Math.max(4 + PXS, w.by);
      b.style.translate = `${left.toFixed(1)}px ${top.toFixed(1)}px`;
      const ax = clamp(wx, left + 3 * PXS, left + w.bw - 3 * PXS), ay = top + w.bh + PXS;
      b.style.setProperty('--ox', (ax - left).toFixed(1) + 'px');
      DOTS.forEach((d, i) => {
        const dx = ax + (wx - ax) * d.at - d.size / 2, dy = ay + (wy - ay) * d.at - d.size / 2;
        w.dots[i].style.translate = `${dx.toFixed(1)}px ${dy.toFixed(1)}px`;
      });
    }
  }
  if (document.fonts) document.fonts.addEventListener('loadingdone', () => live.forEach(measure));

  // ---------------- chat ----------------
  const BOTS = new Set(['nightbot', 'streamelements', 'streamlabs', 'moobot', 'fossabot', 'soundalerts', 'wizebot',
    'sery_bot', 'kofistreambot', 'botrixoficial', 'commanderroot', ...CFG.ignore.toLowerCase().split(/[\s,]+/).filter(Boolean)]);

  // The broadcaster, remembered from their chat (so the Join button joins them with their own name and color)
  const OWNER_KEY = 'drop.owner.v1';
  let owner = null;
  try { owner = JSON.parse(localStorage.getItem(OWNER_KEY) || 'null'); } catch (e) {}
  function ownerSeen(key, name, color) {
    if (owner && owner.key === key && owner.color === (color || '')) return;
    owner = { key, name, color: color || '' };
    try { localStorage.setItem(OWNER_KEY, JSON.stringify(owner)); } catch (e) {}
  }
  function ownerId() {
    if (owner) return owner;
    if (CFG.channel) return { key: 'twitch:' + CFG.channel, name: CFG.channel, color: '' };
    if (CFG.kick) return { key: 'kick:' + CFG.kick, name: CFG.kick, color: '' };
    return { key: 'custom:broadcaster', name: 'Broadcaster', color: '' };
  }

  function handleChat({ name, text, tokens, color, platform = 'custom', owner: isOwner = false, mod = false }) {
    if (!name) return;
    const lower = String(name).toLowerCase();
    if (BOTS.has(lower)) return;
    const plain = (text || '').trim(), cmd = plain.split(/\s+/)[0].toLowerCase();
    const key = platform + ':' + lower, nm = String(name).slice(0, 25);
    if (isOwner && platform !== 'demo') ownerSeen(key, nm, color);
    lastChat.set(key, performance.now());
    if (CFG.auto) join(key, nm, color, true);
    if (cmd === CFG.joincmd) { join(key, nm, color); return; }

  // ---------------- Twitch (anonymous IRC over WebSocket) ----------------
  function parseTags(raw) {
    const o = {};
    const un = v => v.replace(/\\(.)/g, (_, c) => ({ s: ' ', ':': ';', '\\': '\\', r: '\r', n: '\n' }[c] ?? c));
    raw.split(';').forEach(kv => { const i = kv.indexOf('='); o[kv.slice(0, i)] = un(kv.slice(i + 1)); });

  // native Twitch emotes, as pictures in the bubble
  function twitchTokens(msg, tags) {
    const chars = Array.from(msg), ranges = [];
    (tags.emotes || '').split('/').forEach(e => {
      const [id, pos] = e.split(':');
      if (pos) pos.split(',').forEach(p => { const [a, b] = p.split('-').map(Number); ranges.push({ id, a, b }); });
    });
    ranges.sort((x, y) => x.a - y.a);
    const out = []; let i = 0;
    for (const r of ranges) {
      if (r.a < i) continue;
      if (r.a > i) out.push({ t: 'text', v: chars.slice(i, r.a).join('') });
      out.push({ t: 'emote', code: chars.slice(r.a, r.b + 1).join(''), url: `https://static-cdn.jtvnw.net/emoticons/v2/${r.id}/default/dark/2.0` });
      i = r.b + 1;
    }
    if (i < chars.length) out.push({ t: 'text', v: chars.slice(i).join('') });
    return out;
  }
  function connectTwitch(channel) {
    const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    ws.onopen = () => {
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      ws.send('PASS SCHMOOPIIE');
      ws.send('NICK justinfan' + Math.floor(10000 + Math.random() * 80000));
      ws.send('JOIN #' + channel);
    };
    ws.onmessage = (ev) => {
      for (const line of ev.data.split('\r\n')) {
        if (!line) continue;
        if (line.startsWith('PING')) { ws.send('PONG :tmi.twitch.tv'); continue; }
        const m = /^(?:@(\S+) )?:([^!\s]+)![^ ]+ PRIVMSG #\S+ :(.*)$/.exec(line);
        if (m) {
          const tags = m[1] ? parseTags(m[1]) : {};
          let msg = m[3];
          const act = /^\u0001ACTION (.*)\u0001$/.exec(msg);
          if (act) msg = act[1];
          handleChat({ name: tags['display-name'] || m[2], text: msg, tokens: twitchTokens(msg, tags), color: tags.color, platform: 'twitch',

  const KICK_PUSHER = 'wss://ws-us2.pusher.com/app/32cbd69e4b950bf97679?protocol=7&client=js&version=8.4.0&flash=false';
  async function connectKick(slug) {
    let chatroom;
    try {
      const r = await fetch(`https://kick.com/api/v2/channels/${encodeURIComponent(slug)}`);
      chatroom = (await r.json()).chatroom?.id;
      if (!chatroom) throw new Error('no chatroom');

    kickSocket(chatroom);

  function kickSocket(chatroom) {
    const ws = new WebSocket(KICK_PUSHER);
    ws.onmessage = (ev) => {
      let o; try { o = JSON.parse(ev.data); } catch { return; }
      if (o.event === 'pusher:connection_established') {
        ws.send(JSON.stringify({ event: 'pusher:subscribe', data: { auth: '', channel: `chatrooms.${chatroom}.v2` } }));
        return;
      }
      if (o.event === 'pusher:ping') { ws.send(JSON.stringify({ event: 'pusher:pong', data: {} })); return; }
      let d; try { d = typeof o.data === 'string' ? JSON.parse(o.data) : o.data; } catch { return; }
      if (!d) return;
      const ev2 = String(o.event).split('\\').pop();
      if (ev2 === 'ChatMessageEvent') {
        const s = d.sender || {}, badges = (s.identity?.badges || []).map(b => b.type);
        handleChat({ name: s.username, text: (d.content || '').replace(/\[emote:\d+:([^\]]+)\]/g, '$1'),
          tokens: kickTokens(d.content || ''), color: s.identity?.color, platform: 'kick',
          owner: badges.includes('broadcaster') || String(s.username || '').toLowerCase() === CFG.kick,
          mod: badges.includes('moderator') });
      } else if (ev2 === 'UserBannedEvent') leave('kick:' + String(d.user?.username || '').toLowerCase());
    };
    ws.onclose = () => setTimeout(() => kickSocket(chatroom), 3000);
    ws.onerror = () => {};
  }
  // Kick emotes arrive inline as [emote:ID:name]
  function kickTokens(content) {
    const out = [], re = /\[emote:(\d+):([^\]]+)\]/g;
    let m, i = 0;
    while ((m = re.exec(content))) {
      if (m.index > i) out.push({ t: 'text', v: content.slice(i, m.index) });
      out.push({ t: 'emote', code: m[2], url: `https://files.kick.com/emotes/${m[1]}/fullsize` });
      i = re.lastIndex;
    }
    if (i < content.length) out.push({ t: 'text', v: content.slice(i) });
    return out;
  }

  function connectBridge(url, platform) {
    let ws;

  // ---------------- YouTube (Data API v3 polling) ----------------
  async function connectYouTube(videoId, key) {
    const API = 'https://www.googleapis.com/youtube/v3/';
    const retry = () => setTimeout(() => connectYouTube(videoId, key), 30000);
    let chatId;
    try {
      const r = await fetch(`${API}videos?part=liveStreamingDetails&id=${encodeURIComponent(videoId)}&key=${encodeURIComponent(key)}`);
      chatId = (await r.json()).items?.[0]?.liveStreamingDetails?.activeLiveChatId;
      if (!chatId) { console.warn('[drop] YouTube: no active live chat for', videoId); return retry(); }
    } catch (e) { return retry(); }
    let pageToken = '', first = true;
    const poll = async () => {
      let wait = CFG.ytpoll * 1000;
      try {
        const r = await fetch(`${API}liveChat/messages?liveChatId=${encodeURIComponent(chatId)}&part=snippet,authorDetails&maxResults=200&key=${encodeURIComponent(key)}${pageToken ? '&pageToken=' + pageToken : ''}`);
        const j = await r.json();
        if (j.error) { if (r.status === 403 || r.status === 404) return retry(); wait = 15000; }
        else {
          pageToken = j.nextPageToken || pageToken;
          wait = Math.max(wait, j.pollingIntervalMillis || 0);
          // spread a batch out over the poll window (and skip the backlog on connect)
          if (!first) {
            const items = (j.items || []).filter(it => it.snippet?.displayMessage);
            items.forEach((it, i) => setTimeout(() => handleChat({ name: it.authorDetails?.displayName, text: it.snippet.displayMessage, platform: 'youtube',
              owner: !!it.authorDetails?.isChatOwner, mod: !!it.authorDetails?.isChatModerator }),
              i / Math.max(1, items.length) * wait * 0.8));
          }
          first = false;
        }
      } catch (e) { wait = 15000; }
      setTimeout(poll, wait);
    };

  }

  // ---------------- settings window and host buttons ----------------
  // The gear's cog, drawn as pixel art: 8 teeth on a 21 × 21 grid, white with an ink outline.
  function pixelCog(N = 21, teeth = 8) {
    const c = (N - 1) / 2, fill = new Set(), out = [];
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const r = Math.hypot(x - c, y - c), f = ((Math.atan2(y - c, x - c) / (2 * Math.PI) * teeth) % 1 + 1) % 1;
      if (r > 2.6 && r <= (Math.min(f, 1 - f) < 0.21 ? 9.4 : 7)) fill.add(y * N + x);
    }
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = y * N + x;
      const edge = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => fill.has((y + dy) * N + x + dx) && x + dx >= 0 && x + dx < N);
      if (fill.has(i) || edge) out.push(`<rect x="${x}" y="${y}" width="1" height="1" fill="${fill.has(i) ? '#fff' : '#1f1830'}"/>`);
    }
    return `<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges">${out.join('')}</svg>`;
  }

      if (f.sec) {
        sec = document.createElement('div'); sec.className = 'sp-sec';
        const h = document.createElement('h3'); h.textContent = f.sec; sec.appendChild(h);
        body.appendChild(sec); continue;
      }
      const wrapF = document.createElement('div'); wrapF.className = 'sp-f';
      const id = 'sp-' + f.k;
      const lab = document.createElement('label'); lab.htmlFor = id; lab.textContent = f.label;
      let inp;
      if (f.type === 'bool') {
        const row = document.createElement('div'); row.className = 'sp-row';
        const sw = document.createElement('span'); sw.className = 'sw';
        inp = document.createElement('input'); inp.type = 'checkbox';
        sw.append(inp, document.createElement('i'));
        row.append(lab, sw); wrapF.appendChild(row);
      } else if (f.type === 'select') {
        inp = document.createElement('select');
        for (const [v, t] of f.opts) { const o = document.createElement('option'); o.value = v; o.textContent = t; inp.appendChild(o); }
        wrapF.append(lab, inp);
      } else {
        inp = document.createElement('input');
        inp.type = f.type === 'num' ? 'number' : f.type;
        if (f.type === 'num') { inp.min = f.min; inp.max = f.max; inp.step = f.step; }
        if (f.ph) inp.placeholder = f.ph;
        inp.spellcheck = false; inp.autocomplete = 'off';
        wrapF.append(lab, inp);
      }
      inp.id = id;
      if (f.help) { const sm = document.createElement('small'); sm.textContent = f.help; wrapF.appendChild(sm); }
      if (f.k in fromURL) {
        inp.disabled = true;
        const sm = document.createElement('small'); sm.className = 'url';
        sm.textContent = 'Set by the source URL, which overrides this.';
        wrapF.appendChild(sm);
      }
      inputs[f.k] = inp;
      sec.appendChild(wrapF);
    }

    const fill = (vals) => {
      for (const [k, inp] of Object.entries(inputs)) {
        const v = vals[k];
        if (FIELD[k].type === 'bool') inp.checked = !!v; else inp.value = v;
      }
    };
    const read = () => {
      const out = {};
      for (const [k, inp] of Object.entries(inputs)) out[k] = coerce(FIELD[k], FIELD[k].type === 'bool' ? inp.checked : inp.value);
      return out;
    };
    const open = () => {
      fill(SET);
      msg.textContent = storageOK ? '' : 'This browser source can\'t save settings — use "Copy setup link" instead.';
      linkBox.style.display = 'none';
      panel.classList.add('open');
    };
    const close = () => panel.classList.remove('open');

    gear.addEventListener('click', open);
    panel.addEventListener('mousedown', e => { if (e.target === panel) close(); });
    addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

    panel.querySelector('.sp-foot').addEventListener('click', e => {
      const act = e.target.dataset && e.target.dataset.act;
      if (!act) return;
      if (act === 'close') close();
      if (act === 'test') {
        const n = 'test_racer_' + Math.floor(Math.random() * 1000);
        join('custom:' + n, n, '');
        msg.textContent = state === 'lobby' ? 'Added a test racer: watch for a wheel dropping onto the starting line.' : 'Added a test racer to the next race.';
      }
      if (act === 'defaults') {
        const d = {}; for (const f of Object.values(FIELD)) d[f.k] = f.def;
        fill(d); msg.textContent = 'Defaults filled in — press Save & apply to keep them.';
      }
      if (act === 'link') {
        const vals = read(), q = new URLSearchParams();
        for (const f of Object.values(FIELD)) {
          const v = vals[f.k];
          if (v === f.def) continue;
          q.set(f.k, f.type === 'bool' ? (v ? '1' : '0') : String(v));
        }
        const link = location.href.split(/[?#]/)[0] + (q.toString() ? '?' + q.toString() : '');
        linkBox.value = link; linkBox.style.display = 'block'; linkBox.select();
        const done = () => { msg.textContent = 'Setup link copied' + (vals.ytkey ? ' (it includes your YouTube API key — keep it private).' : '.'); };
        try { navigator.clipboard.writeText(link).then(done, () => { document.execCommand('copy'); done(); }); }
        catch (err) { try { document.execCommand('copy'); done(); } catch (e2) { msg.textContent = 'Copy the link from the box below.'; } }
      }
      if (act === 'save') {
        try {
          const vals = read();
          // fields locked by the URL keep whatever was saved before (the URL value isn't a choice made here)
          for (const k in fromURL) { if (k in saved) vals[k] = coerce(FIELD[k], saved[k]); else delete vals[k]; }
          localStorage.setItem(STORE_KEY, JSON.stringify(vals));
          msg.textContent = 'Saved! Reloading…';
          setTimeout(() => location.reload(), 250);
        } catch (err) {
          msg.textContent = 'Couldn\'t save here — use "Copy setup link" and paste it as the source URL.';
        }
      }
    });

    // the buttons only appear while a mouse is over the overlay (i.e. in OBS's Interact window)
    let mt;
    addEventListener('mousemove', () => {
      document.body.classList.add('mouse');
      clearTimeout(mt); mt = setTimeout(() => document.body.classList.remove('mouse'), 3000);
    });
    document.addEventListener('mouseleave', () => document.body.classList.remove('mouse'));
  })();

  // ---------------- self-test ----------------
  // ?selftest=N races 30 wheels down N fresh machines as fast as it can, with no drawing, and writes how
  // each race went into the page (and the console): how long the first and last took, the floors it was
  // built from, and how often a wheel needed a nudge or a lift.
  function selfTest(n) {
    SIM = true;
    const out = [];
    for (let r = 0; r < n; r++) {
      racers.clear(); finished = []; state = 'lobby'; simT = 0;
      build();
      for (let i = 0; i < 30; i++) { const w = makeWheel('t:' + i, 'w' + i, ''); racers.set(w.key, w); dropIn(w); }
      refreshLive();
      for (let i = 0; i < 240 * 2; i++) stepAll(STEP);
      state = 'race'; raceT0 = simT; K.doorsOpen = true; for (const s of K.slats) s.on = false; if (C3) C3.open();
      for (const w of racers.values()) { w.prog = simT; w.bestY = w.y; }
      while (finished.length < racers.size && simT - raceT0 < 400) stepAll(STEP);
      const ws = [...racers.values()];
      out.push({ W, H, floors: K.bands.map(b => b.kind).join(','), first: +(finished[0]?.time ?? -1).toFixed(1), last: +(finished.at(-1)?.time ?? -1).toFixed(1),
        done: finished.length, kicks: ws.reduce((a, w) => a + w.kicks, 0), warps: ws.reduce((a, w) => a + w.warps, 0),
        loops: K.bands.reduce((a, b) => a + b.loops.length, 0), pipes: K.pipes?.length, stuck: K.stuck, course: K.pieces?.map(p => p.kind).join(','), left: ws.filter(w => w.mode !== 'done').map(w => [w.m3, K.pieces?.[w.pi]?.kind, w.pi, Math.round(w.s || 0), w.frad && +w.frad.toFixed(1), w.fL | 0, w.fh && +w.fh.toFixed(1), w.Y | 0, w.land]), traps: K.traps.length, hops: K.hops.length });
    }
    const pre = document.createElement('pre'); pre.id = 'selftest'; pre.textContent = JSON.stringify(out);
    document.body.appendChild(pre);
    console.log('[drop] selftest', out);
  }

  // ---------------- boot ----------------
  // In 3D the race runs on its own course (course3d.js) before anything's built; if that can't load, it's 2D.
  resize();
  const ready = DEPTH
    ? import('./course3d.js').then(m => { C3 = m.createCourse({ RW: RB3, G, emit, popup, SYMS, onFinish: w => finish(w) }); })
      .catch(e => console.warn("[drop] the 3D course didn't load, so it's 2D", e))
    : Promise.resolve();
  ready.then(boot);
  function boot() {
  if (SELFTEST) { selfTest(SELFTEST); return; }
  build();
  addEventListener('resize', () => {
    const w = W, h = H;
    resize();
    if (W === w && H === h || C3) return;   // (the 3D course doesn't depend on the source's size)
    const ws = [...racers.values()];
    build();
    if (state === 'lobby' || state === 'count') for (const r of ws) dropIn(r);
    else if (state === 'race') {   // (mid-race: a new machine, and everyone still going starts again from the top floor)
      K.doorsOpen = true; K.doorAng = 1; K.openT = -9; for (const s of K.slats) s.on = false;
      for (const r of live) warp(r, 0);
    }
  });
  const begin = () => { last = performance.now(); updateSign(); updateHost(); show(sign, true); requestAnimationFrame(frame); };
  // The 3D view (view3d.js) draws the same race, reading the game through view3d(). If it can't load (say
  // the three.js CDN is down), the 2D view takes over.
  if (CFG.view === '3d' && C3) {
    document.body.classList.add('v3d');
    import('./view3d.js').then(m => { R3 = m.create(view3d()); })
      .catch(e => { console.warn('[drop] the 3D view didn\'t load, so it\'s 2D', e); document.body.classList.remove('v3d'); })
      .finally(begin);
  } else begin();

  if (CFG.channel) connectTwitch(CFG.channel);
  if (CFG.kick) connectKick(CFG.kick);
  if (CFG.tiktok) connectBridge(CFG.tiktok, 'tiktok');
  if (CFG.youtube) {
    if (/^wss?:\/\//i.test(CFG.youtube)) connectBridge(CFG.youtube, 'youtube');
    else if (CFG.ytkey) connectYouTube(ytId(CFG.youtube), CFG.ytkey);
    else console.warn('[drop] youtube= needs ytkey= (or a ws:// bridge URL)');
  }
  if (CFG.demo) runDemo();
  }
})();
</script>
</body>
