<!doctype html>
<!--
  Ball Drop — OBS browser source
  ------------------------------
  A pachinko-style race for chat. Viewers type !join and get a little pixel wheel in their chat color on the
  starting shelf at the top of the screen. When a mod (or the broadcaster) types !start, the shelf's trapdoors
  drop and every wheel races down a machine that's thrown together fresh for each race: ramps that roll them
  back and forth across the screen, peaks that split the pack, funnels, pinball flippers, pegs and pop
  bumpers, springs, loops, trapdoors, gaps only the fast ones clear, and glass pipes that take a shortcut down.
  However it's put together there's always a way through, with forks along the way, and whoever reaches the
  goal at the bottom first wins. It's built from the Stunt Wheel's track, casino and pinball pieces.

  Racers' names always show over their wheels. When a racer chats during the race, only their emotes (and
  emoji) pop up in a speech bubble over their wheel; the words are left out.

  OBS: Add > Browser, URL https://drop.ixitxachitl.com/, at your canvas size (e.g. 1920x1080). The background
       is transparent inside OBS automatically.

  CONTROLS: in OBS, right-click this source → Interact and move the mouse over the overlay. The buttons in the
  bottom-right corner join you to the race, start it and build a new machine; the gear opens the settings.
  Every setting can also be a URL parameter, which overrides it.

  Chat (all read anonymously):
    channel   Twitch channel          kick      Kick channel
    tiktok    TikTok bridge: 1 = TikFinity on this PC, or a ws:// address
    youtube   a live video ID or link (needs ytkey), or a ws:// bridge
    ytkey     YouTube Data API v3 key ytpoll    seconds between YouTube checks (default 6)
    ignore    extra bot names to ignore, comma separated
    demo      1 = fake chatters join and race, for trying it out

  Race:
    joincmd   join command (default !join; anyone)
    startcmd  start command (default !start; mods and the broadcaster). It needs at least one racer.
    auto      1 = auto mode: anyone who chats is in, and races start and run by themselves, one after another
    autowait  auto mode: seconds each race waits from the first racer being in (default 20)
    autoidle  auto mode: minutes without chatting before someone's left out of the next race (default 10)
    max       most racers in one race (default 40)
    autostart seconds after the first racer joins until it starts by itself (default 0 = off)
    keep      1 = racers stay in for the next race
    finish    seconds the rest get to finish after the winner (default 20)
    results   seconds the results stay up (default 12)

  Racers:
    bubbles   0 = no emote bubbles     emotesize  emote size in px (default 28)
    hold      bubble time multiplier   namesize   name size in px (default 13)

  Machine:
    scale     pixel size (default 3; bigger = chunkier pixels and a shorter machine)
    width     machine width, % of the source (default 100)
    speed     game speed multiplier (default 1)
    decor     0 = no floating dice, chips and stars behind the machine
    scenery   0 = no Vegas skyline and searchlights
    bg        testing: none = transparent in a normal browser too, or a color (default: dark outside OBS)

  3D view (course3d.js and view3d.js, drawn with three.js): its own race, down one long, wide, winding
  track through space (banked turns, helixes, loops, jumps, glass funnels, a pachinko slope, a pinball
  table, lane splits), the racers as balls, under a night sky (so the source isn't see-through), with a
  camera you can move. Joining, starting, the signs and the bubbles are the same as in 2D.
    view      3d = the 3D view instead of pixel art
    camera    overview = start on the whole course instead of auto (which follows the leader)
    camcmd    mods' camera command (default !cam): "!cam name" follows a racer, "!cam all" the whole
              course, "!cam" back to auto
    shadows   0 = no shadows, if it's slow
  In OBS's Interact window: drag to orbit, wheel to zoom, right-drag to pan, click a racer to follow them,
  double-click empty space for auto; keys A = auto, O = whole machine, F = leave the camera be, ← / → =
  follow the next racer.

  Custom integrations (Streamer.bot, etc.) can call window.drop.join(name, { color }), .leave(name), .start(),
  .say(name, text), .newTrack() and .cam(arg) (like "!cam arg").
-->
<html>
<head>
<meta charset="utf-8">
<title>Ball Drop</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<!-- three.js, for the 3D view (only loaded when it's on) -->
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;height:100%}
  #c{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
  #ui{position:fixed;left:0;top:0;pointer-events:none}
  /* the 3D view: its own canvas instead of the pixel one, and a tag saying what the camera's doing */
  body.v3d #c{display:none}
  #gl{position:fixed;left:0;top:0;display:block;outline:none}
  #cam{position:fixed;left:16px;bottom:16px;z-index:15;padding:8px 11px 7px;font:11px/1 var(--pix);color:var(--ink);background:#fffaf0;
    box-shadow:var(--vx);--p:3px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #cam.show,body.mouse #cam{opacity:1}
  #cam b{color:var(--c,#c4500f)}
  /* Pixel style shared by the bubbles, the signs and the settings window: square corners, and --vx draws a
     notched ink outline (four offset shadows leave the corners out). --p is one machine pixel on screen. */
  :root{--ink:#1f1830;--p:4px;
    --vx:0 calc(-1 * var(--p)) 0 0 var(--ink),0 var(--p) 0 0 var(--ink),calc(-1 * var(--p)) 0 0 0 var(--ink),var(--p) 0 0 0 var(--ink);
    --lit:inset 0 4px 0 0 rgba(255,255,255,.55),inset 0 -5px 0 0 rgba(0,0,0,.2);
    --pix:'Press Start 2P',monospace;--txt:'Pixelify Sans',system-ui,sans-serif;--es:28px}
  /* Pixelify Sans's "fi" ligature looks like an "A" (set on everything, since the font shorthand resets it) */
  *{font-variant-ligatures:none}

  /* ---------- emote bubbles, moved over their wheel every frame ---------- */
  @keyframes grow{from{scale:0}to{scale:1}}
  .bub{position:fixed;left:0;top:0;width:max-content;max-width:calc(var(--es) * 6.4);box-sizing:border-box;
    padding:calc(var(--p) + 2px) calc(var(--p) + 3px);background:#fffaf0;color:var(--ink);
    font:500 calc(var(--es) * .9)/1 var(--txt);box-shadow:var(--vx);display:flex;flex-wrap:wrap;gap:2px;justify-content:center;
    pointer-events:none;will-change:translate,scale;opacity:0;transition:opacity .25s;transform-origin:var(--ox,16px) 100%;z-index:5}
  .bub.show{opacity:1;animation:grow .3s cubic-bezier(.25,1.25,.5,1)}
  .bub img{height:var(--es);display:block}
  .bub span{display:block;height:var(--es);line-height:var(--es)}
  .bub-dot{position:fixed;left:0;top:0;background:#fffaf0;box-shadow:var(--vx);pointer-events:none;z-index:5;
    will-change:translate,scale;opacity:0;transition:opacity .3s}
  .bub-dot.show{opacity:1;animation:grow .3s ease-out}

  /* ---------- signs: the lobby sign, the countdown, the winner and the results ---------- */
  /* Track colors: an orange girder header with the ramps' red-and-white stripes, like the settings window. */
  .panel{--p:4px;position:fixed;left:50%;top:50%;z-index:20;width:max-content;max-width:min(92vw,720px);
    translate:-50% -50%;background:#ece4d0;box-shadow:var(--vx),12px 12px 0 2px rgba(20,10,40,.5);
    font:500 20px/1.35 var(--txt);color:var(--ink);text-align:center;pointer-events:none;
    opacity:0;scale:.5;transition:opacity .25s,scale .35s cubic-bezier(.25,1.4,.5,1)}
  .panel.show{opacity:1;scale:1}
  .p-head{position:relative;padding:30px 26px 14px;background:linear-gradient(90deg,rgba(0,0,0,.08) 2px,transparent 2px) 0 0/16px 16px,#ff9a1f;
    box-shadow:inset 0 -4px 0 0 #c4500f,inset 0 -8px 0 0 #7a2c0a}
  .p-head::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:#fff3a8}
  .p-head::after{content:"";position:absolute;left:0;right:0;top:8px;height:8px;background:repeating-linear-gradient(90deg,#ff3b3b 0 12px,#fff 12px 24px)}
  .p-head h1{margin:0;font:30px/1.2 var(--pix);color:#fff;text-shadow:4px 4px 0 #7a2c0a;letter-spacing:2px}
  .p-body{padding:16px 26px 20px;background:linear-gradient(rgba(0,0,0,.035) 2px,transparent 2px) 0 0/16px 16px}
  .p-body p{margin:6px 0}
  .p-big{font:16px/1.6 var(--pix)}
  kbd{display:inline-block;padding:4px 8px 3px;margin:0 4px;font:inherit;background:#3ff8ff;color:var(--ink);box-shadow:var(--vx),inset 0 -3px 0 0 rgba(0,0,0,.2)}
  .p-cnt{font:12px/1.6 var(--pix);color:#c4500f}
  .p-hint{font-size:16px;color:#5d5570}
  #sign{top:44%}
  #banner{top:24%}
  #banner .p-body{display:flex;align-items:center;gap:18px;justify-content:center}
  #banner canvas{width:78px;height:78px;image-rendering:pixelated;flex:none}
  .chip{display:inline-block;max-width:420px;padding:6px 10px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;
    font:18px/1.2 var(--pix);background:var(--c);color:var(--ink);box-shadow:var(--vx),inset 0 -3px 0 0 rgba(0,0,0,.25)}
  #banner .chip{font-size:22px}
  .p-sub{font:12px/1.6 var(--pix);margin-top:10px !important;color:#c4500f}
  #results ol{margin:0;padding:0;list-style:none;text-align:left;min-width:360px}
  #results li{display:flex;align-items:center;gap:12px;padding:5px 0}
  #results li .n{width:52px;font:14px var(--pix);color:#c4500f;text-align:right}
  #results li:first-child .n{color:#e8a020}
  #results li .chip{font-size:13px;flex:1;max-width:340px}
  #results li .t{font:12px var(--pix);color:#5d5570}
  #count{position:fixed;left:50%;top:44%;z-index:21;translate:-50% -50%;font:120px/1 var(--pix);color:#ffe600;pointer-events:none;
    text-shadow:6px 0 0 var(--ink),-6px 0 0 var(--ink),0 6px 0 var(--ink),0 -6px 0 var(--ink),10px 10px 0 #7a2c0a;opacity:0}
  @keyframes pop{0%{scale:2.2;opacity:0}25%{scale:1;opacity:1}80%{opacity:1}100%{opacity:0;scale:.9}}
  #count.go{animation:pop 1s ease-out forwards}
  #hud{position:fixed;right:16px;top:14px;z-index:15;padding:9px 12px 8px;font:13px/1 var(--pix);color:var(--ink);background:#fffaf0;
    box-shadow:var(--vx);opacity:0;transition:opacity .3s;pointer-events:none;--p:3px}
  #hud.show{opacity:1}
  #hud .flag{width:15px;height:15px;margin:-3px 0 -3px 7px;vertical-align:top}
  #toast{position:fixed;left:50%;bottom:24px;translate:-50% 0;z-index:30;padding:10px 14px 9px;font:13px/1.3 var(--pix);background:#fffaf0;color:var(--ink);
    box-shadow:var(--vx),6px 6px 0 0 rgba(20,10,40,.4);opacity:0;transition:opacity .3s;pointer-events:none;max-width:80vw;text-align:center;--p:3px}
  #toast.show{opacity:1}

  /* ---------- host buttons and the settings window (only visible while you interact with the source) ---------- */
  #host{position:fixed;right:84px;bottom:22px;z-index:1000;display:flex;gap:14px;opacity:0;pointer-events:none;transition:opacity .25s}
  body.mouse #host{opacity:1;pointer-events:auto}
  #views{position:fixed;right:16px;top:58px;z-index:1000;display:flex;gap:12px;opacity:0;pointer-events:none;transition:opacity .25s}
  body.mouse #views{opacity:1;pointer-events:auto}
  #views .on{background:#ffe600}
  #gear{position:fixed;right:20px;bottom:20px;width:48px;height:48px;z-index:1000;border:0;border-radius:0;
    background:#ff9a1f;box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),var(--lit),6px 6px 0 2px rgba(20,10,40,.45);
    cursor:pointer;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .1s}
  body.mouse #gear{opacity:1;pointer-events:auto}
  #gear:hover{transform:translateY(-2px)}
  #gear:active{transform:translateY(2px)}
  #gear svg{width:30px;height:30px}
  #settings{--p:4px;position:fixed;inset:0;z-index:1001;display:none;align-items:center;justify-content:center;
    background:rgba(16,10,32,.6) linear-gradient(rgba(255,255,255,.03) 2px,transparent 2px) 0 0/16px 16px;
    pointer-events:auto;font:500 15px/1.35 var(--txt);color:var(--ink)}
  #settings.open{display:flex}
  .sp{width:min(900px,92vw);max-height:90vh;display:flex;flex-direction:column;background:#ece4d0;
    box-shadow:var(--vx),12px 12px 0 2px rgba(20,10,40,.5)}
  .sp-head{position:relative;padding:30px 22px 14px;color:#fff3dc;
    background:linear-gradient(90deg,rgba(0,0,0,.08) 2px,transparent 2px) 0 0/16px 16px,#ff9a1f;
    box-shadow:inset 0 -4px 0 0 #c4500f,inset 0 -8px 0 0 #7a2c0a}
  .sp-head::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:#fff3a8}
  .sp-head::after{content:"";position:absolute;left:0;right:0;top:8px;height:8px;
    background:repeating-linear-gradient(90deg,#ff3b3b 0 12px,#fff 12px 24px)}
  .sp-head h2{margin:0;font:20px/1.2 var(--pix);color:#fff;text-shadow:3px 3px 0 #7a2c0a;letter-spacing:1px}
  .sp-head p{margin:8px 0 0;font-size:14px;color:#3a1406}
  .sp-body{overflow:auto;padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;
    background:linear-gradient(rgba(0,0,0,.035) 2px,transparent 2px) 0 0/16px 16px,
      linear-gradient(90deg,rgba(0,0,0,.035) 2px,transparent 2px) 0 0/16px 16px}
  .sp-sec{padding:12px 14px 14px;background:#fffaf0;box-shadow:var(--vx),var(--lit),6px 6px 0 0 rgba(31,24,48,.18)}
  .sp-sec h3{margin:0 0 12px;font:12px/1.3 var(--pix);color:#c4500f;text-shadow:2px 2px 0 #ffe2b8}
  .sp-f{margin:0 0 12px}
  .sp-f:last-child{margin-bottom:0}
  .sp-f label{display:block;margin-bottom:5px;font-weight:700}
  .sp-f input[type=text],.sp-f input[type=password],.sp-f input[type=number],.sp-f select{
    width:100%;box-sizing:border-box;font:500 15px var(--txt);padding:7px 9px;border:0;border-radius:0;
    background:#fff;color:var(--ink);box-shadow:var(--vx),inset 0 4px 0 0 rgba(0,0,0,.12)}
  .sp-f input:focus,.sp-f select:focus{outline:3px solid #3ff8ff;outline-offset:5px}
  .sp-f input:disabled,.sp-f select:disabled{background:#e4ddcc;color:#6a6278}
  .sp-f small{display:block;margin-top:6px;font-size:13px;color:#5d5570}
  .sp-f small.url{color:#c2185b}
  .sp-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .sp-row label{margin:0}
  .sw{position:relative;width:48px;height:24px;flex:none;margin-right:4px}
  .sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
  .sw i{position:absolute;inset:0;background:#c9c0ae;box-shadow:var(--vx),inset 0 4px 0 0 rgba(0,0,0,.15)}
  .sw i::after{content:'';position:absolute;top:4px;left:4px;width:16px;height:16px;background:#fff;
    box-shadow:0 0 0 3px var(--ink),inset 0 -3px 0 0 rgba(0,0,0,.2);transition:transform .12s ease-out}
  .sw input:checked + i{background:#3ff8ff}
  .sw input:checked + i::after{transform:translateX(24px)}
  .sw input:disabled + i{opacity:.5}
  .sp-foot{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:16px 22px;background:#d8cfb8;
    box-shadow:inset 0 4px 0 0 var(--ink)}
  .sp-foot .grow{flex:1}
  .sp-btn{--p:4px;font:11px/1 var(--pix);padding:11px 14px 12px;border:0;border-radius:0;background:#fffaf0;color:var(--ink);
    box-shadow:var(--vx),var(--lit),0 6px 0 2px rgba(31,24,48,.35);cursor:pointer;transition:transform .06s}
  .sp-btn:hover{transform:translateY(-2px)}
  .sp-btn:active{transform:translateY(3px);box-shadow:var(--vx),var(--lit)}
  .sp-btn.go{background:#ff9a1f;color:#fff;text-shadow:2px 2px 0 #7a2c0a}
  .sp-btn.warn{background:#ff9fbd}
  .sp-btn:disabled{opacity:.45;cursor:default;transform:none}
  .sp-msg{font-size:14px;color:#c4500f;min-height:1em}
  .sp-link{width:100%;font:12px monospace;padding:6px;border:0;box-shadow:var(--vx);display:none;margin-top:6px}
  @media (max-height:560px){
    #settings{align-items:flex-start}
    .sp{display:block;max-height:none;height:100vh;overflow:auto}
    .sp-head{padding:24px 16px 12px}
    .sp-head p{display:none}
    .sp-body{padding:14px 16px;gap:16px;overflow:visible}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="ui"></canvas>
<div id="sign" class="panel"><div class="p-head"><h1>BALL DROP</h1></div>
  <div class="p-body"><p class="p-big">Type <kbd id="s-join">!join</kbd> to race</p>
    <p class="p-cnt" id="s-cnt"></p><p class="p-hint" id="s-hint"></p></div></div>
<div id="banner" class="panel"><div class="p-head"><h1>WINNER!</h1></div>
  <div class="p-body"><canvas id="b-wheel" width="13" height="13"></canvas><div><span class="chip" id="b-name"></span>
    <p class="p-sub" id="b-time"></p></div></div></div>
<div id="results" class="panel"><div class="p-head"><h1>RESULTS</h1></div><div class="p-body"><ol id="r-list"></ol>
  <p class="p-hint" id="r-more"></p></div></div>
<div id="count"></div>
<div id="hud"></div>
<div id="toast"></div>
<script>
(() => {
  // ---------------- settings (saved locally; URL parameters override) ----------------
  const Q = new URLSearchParams(location.search);
  const STORE_KEY = 'drop.settings.v1';
  let saved = {}, storageOK = true;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { storageOK = false; }
  const FIELDS = [
    { sec: 'Chat' },
    { k: 'channel', label: 'Twitch channel', type: 'text', def: '', ph: 'yourchannel', help: 'Read anonymously, no login needed.' },
    { k: 'kick', label: 'Kick channel', type: 'text', def: '', ph: 'yourchannel', help: 'Read anonymously, no login needed.' },
    { k: 'tiktok', label: 'TikTok bridge', type: 'text', def: '', ph: '1 = TikFinity, or ws://…', help: 'TikTok needs a local bridge app. "1" uses TikFinity on this PC.' },
    { k: 'youtube', label: 'YouTube live', type: 'text', def: '', ph: 'video ID / link, or ws://…', help: 'A live video ID or link (needs the API key below), or a bridge address.' },
    { k: 'ytkey', label: 'YouTube API key', type: 'password', def: '', help: 'YouTube Data API v3 key from Google Cloud Console.' },
    { k: 'ytpoll', label: 'YouTube check every (s)', type: 'num', def: 6, min: 2, max: 60, step: 1, help: 'Lower = snappier, but uses the daily API quota faster.' },
    { k: 'ignore', label: 'Ignore these names', type: 'text', def: '', ph: 'mybot, otherbot', help: 'Common bots are ignored already.' },
    { k: 'demo', label: 'Demo chat', type: 'bool', def: false, help: 'Fake chatters join and race, for trying it out.' },
    { sec: 'Race' },
    { k: 'joincmd', label: 'Join command', type: 'text', def: '!join', help: 'Anyone in chat can type it to get a wheel in the next race.' },
    { k: 'startcmd', label: 'Start command', type: 'text', def: '!start', help: 'Mods and the broadcaster can start the race with it. There has to be at least one racer.' },
    { k: 'auto', label: 'Auto mode', type: 'bool', def: false, help: "Anyone who chats is in the race, no command needed, and races start and run by themselves, one after another." },
    { k: 'autowait', label: 'Auto mode: start after (s)', type: 'num', def: 20, min: 5, max: 300, step: 5, help: 'How long each race waits, from the first racer being in.' },
    { k: 'autoidle', label: 'Auto mode: quiet for (min)', type: 'num', def: 10, min: 1, max: 120, step: 1, help: "Someone who hasn't chatted for this long isn't in the next race." },
    { k: 'max', label: 'Most racers', type: 'num', def: 40, min: 1, max: 100, step: 1 },
    { k: 'autostart', label: 'Start by itself after (s)', type: 'num', def: 0, min: 0, max: 600, step: 5, help: 'Counted from the first racer joining. 0 = only when someone starts it.' },
    { k: 'keep', label: 'Racers stay in', type: 'bool', def: false, help: 'Everyone who raced is already in the next race, without joining again.' },
    { k: 'finish', label: 'Time for the rest (s)', type: 'num', def: 20, min: 0, max: 180, step: 1, help: 'How long the others get to finish after the winner.' },
    { k: 'results', label: 'Results shown for (s)', type: 'num', def: 12, min: 3, max: 60, step: 1 },
    { sec: 'Racers' },
    { k: 'bubbles', label: 'Emote bubbles', type: 'bool', def: true, help: 'When racers chat, their emotes and emoji pop up over their wheel. Words are left out.' },
    { k: 'emotesize', label: 'Emote size (px)', type: 'num', def: 28, min: 12, max: 72, step: 1 },
    { k: 'hold', label: 'Bubble time ×', type: 'num', def: 1, min: 0.3, max: 5, step: 0.1 },
    { k: 'namesize', label: 'Name size (px)', type: 'num', def: 13, min: 8, max: 32, step: 1 },
    { sec: 'Machine' },
    { k: 'scale', label: 'Pixel size', type: 'num', def: 0, min: 0, max: 8, step: 1, help: '0 = automatic, the same machine at any source size (3 at 1080p). Bigger = chunkier pixels and bigger wheels, but fewer floors.' },
    { k: 'width', label: 'Machine width (%)', type: 'num', def: 100, min: 30, max: 100, step: 5, help: 'Narrower machines stand in the middle of the source.' },
    { k: 'speed', label: 'Speed ×', type: 'num', def: 1, min: 0.25, max: 3, step: 0.05 },
    { k: 'decor', label: 'Floating decorations', type: 'bool', def: true, help: 'Dice, chips, coins and stars drifting behind the machine.' },
    { k: 'scenery', label: 'Vegas skyline', type: 'bool', def: true, help: 'Hotels and searchlights behind the machine.' },
    { sec: '3D view' },
    { k: 'view', label: 'View', type: 'select', def: '2d', opts: [['2d', '2D pixel art'], ['3d', '3D']], help: "3D is its own race: one long winding track, balls, a night sky (so it isn't see-through) and a camera that can orbit, zoom and follow racers." },
    { k: 'camera', label: 'Camera starts on', type: 'select', def: 'auto', opts: [['auto', 'Auto (follows the leader)'], ['overview', 'The whole course']] },
    { k: 'camcmd', label: 'Camera command', type: 'text', def: '!cam', help: 'For mods: "!cam name" follows a racer, "!cam all" shows the whole course, "!cam" goes back to auto.' },
    { k: 'shadows', label: 'Shadows', type: 'bool', def: true, help: 'Turn off if the 3D view is slow on your PC.' },
  ];
  const FIELD = Object.fromEntries(FIELDS.filter(f => f.k).map(f => [f.k, f]));
  function coerce(f, v) {
    if (f.type === 'bool') return v === true || v === 1 || /^(1|true|yes|on)$/i.test(String(v));
    if (f.type === 'num') { const n = parseFloat(v); return isNaN(n) ? f.def : Math.min(f.max, Math.max(f.min, n)); }
    if (f.type === 'select') return f.opts.some(o => o[0] === v) ? v : f.def;
    return String(v ?? '').trim();
  }
  const fromURL = {};
  for (const f of Object.values(FIELD)) if (Q.has(f.k)) fromURL[f.k] = coerce(f, Q.get(f.k));
  const SET = {};
  for (const f of Object.values(FIELD)) SET[f.k] = f.k in fromURL ? fromURL[f.k] : f.k in saved ? coerce(f, saved[f.k]) : f.def;
  const cmdOf = (v, d) => (v || d).toLowerCase().split(/\s+/)[0];
  const CFG = {
    ...SET,
    channel: SET.channel.replace(/^#/, '').toLowerCase(),
    kick: SET.kick.replace(/^.*kick\.com\//i, '').replace(/[/?#].*$/, '').toLowerCase(),
    tiktok: SET.tiktok === '1' ? 'ws://localhost:21213/' : SET.tiktok,
    joincmd: cmdOf(SET.joincmd, '!join'), startcmd: cmdOf(SET.startcmd, '!start'), camcmd: cmdOf(SET.camcmd, '!cam'),
  };
  const SELFTEST = parseInt(Q.get('selftest') || '0', 10);

  // (automatic: about 360 art pixels tall, whatever the source's size)
  const SCALE = CFG.scale || Math.min(8, Math.max(1, Math.round(innerHeight / 360))), SPEED = CFG.speed;
  // Preview background outside OBS so you can actually see it in a browser
  const bgq = Q.get('bg');
  if (bgq && bgq !== 'none') document.body.style.background = bgq;
  else if (!bgq && !window.obsstudio) document.body.style.background = '#1d1b2a';

  const G = 320, RW = 4;           // gravity, wheel radius (art px)
  // In the 3D view the floors are channels ZT either side of the middle, and the balls move across them too
  // (z): pins, bumpers, hard landings and each other knock them about, and they roll past each other at
  // different depths. The 2D view keeps everything in one plane.
  const DEPTH = CFG.view === '3d', ZT = 12, ZB = ZT - RW - 1.5;
  const RB3 = 2.75;   // (the balls' radius on the 3D course: smaller than the 2D wheels)
  const MINV = 40, VMAX = 230;     // the speed wheels roll at on their own, and the fastest they go
  const STEP = 1 / 240;
  const C = {
    top:'#fff3a8', body:'#ff9a1f', dark:'#c4500f', shade:'#7a2c0a',
    post:'rgba(90,70,110,0.55)', lattice:'rgba(90,70,110,0.35)',
    stripeA:'#ff3b3b', stripeB:'#ffffff',
    tire:'#282438',
    boostA:'#3ff8ff', boostB:'#1a5cff', pad:'#5dff6a', padDark:'#1f9e3a', coil:'#c8c8d8',
  };

  // The machine canvas covers the whole source at `scale` screen pixels per art pixel; the names go on a
  // full-resolution canvas over it.
  const cvs = document.getElementById('c'), ui = document.getElementById('ui');
  let ctx = cvs.getContext('2d');   // (bake() points it at an offscreen canvas for a moment)
  const uctx = ui.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    W = Math.ceil(innerWidth / SCALE); H = Math.ceil(innerHeight / SCALE);
    cvs.width = W; cvs.height = H;
    cvs.style.width = W * SCALE + 'px'; cvs.style.height = H * SCALE + 'px';
    ctx.imageSmoothingEnabled = false;
    DPR = devicePixelRatio || 1;
    ui.width = Math.round(innerWidth * DPR); ui.height = Math.round(innerHeight * DPR);
    ui.style.width = innerWidth + 'px'; ui.style.height = innerHeight + 'px';
  }

  const rnd = (a, b) => a + Math.random() * (b - a);
  const ri  = (a, b) => Math.floor(rnd(a, b + 1));
  const pick = a => a[(Math.random() * a.length) | 0];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function pickW(o) {
    let t = 0; for (const k in o) t += o[k];
    let r = Math.random() * t;
    for (const k in o) if ((r -= o[k]) < 0) return k;
    return Object.keys(o)[0];
  }
  // a color made lighter (f > 0, toward white) or darker (f < 0, toward black)
  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16), to = f > 0 ? 255 : 0, k = Math.abs(f);
    const ch = s => Math.round(((n >> s) & 255) + (to - ((n >> s) & 255)) * k);
    return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
  }
  // Draws something once into a little offscreen canvas (px() and friends draw into it while fn runs)
  function bake(w, h, fn) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const main = ctx; ctx = c.getContext('2d');
    try { fn(); } finally { ctx = main; }
    return c;
  }
  function px(x, y, c) { ctx.fillStyle = c; ctx.fillRect(x, y, 1, 1); }

  // ---------------- particles, popups ----------------
  let SIM = false;    // (the self-test runs races with no effects)
  const parts = [], rings = [], pops = [];
  let simT = 0;       // seconds of game time
  // (z: how far in front or behind, in the 3D view; left out, it's anywhere across the track)
  function popup(x, y, text, c, z) { if (!SIM) pops.push({ x, y, z, text, c, l: 1.2 }); }
  function emit(x, y, n, cols, spdX, up, grav = 200, life = [0.3, 0.8], z) {
    if (SIM) return;
    for (let i = 0; i < n; i++) parts.push({ x, y, z, vx: rnd(-spdX, spdX), vy: -rnd(0, up), l: rnd(life[0], life[1]), c: pick(cols), g: grav });
  }

  // ---------------- the machine ----------------
  // Built fresh for every race, from the top down, as a stack of floors ("bands") between two iron walls.
  // Every floor is made of sloping track with holes in it, so wheels always roll downhill to a hole and
  // drop to the floor below: a ramp across the whole width rolls them to the far wall, a peak splits them
  // both ways, a valley gathers them into a hole in the middle (maybe through a glass funnel or between two
  // pinball flippers), and a field of pins and bumpers scatters them. Each floor is picked so it catches
  // what the floor above drops, which rolls the pack back and forth across the screen. Along the ramps go
  // jumps only the faster wheels clear, trapdoors, springs up into floating bumpers, dice and chip stacks to
  // hop, loops, conveyor belts, boost pads and glass pipes down to a floor further on, and things that move:
  // windmills and paddle wheels batting the wheels along, bats that swing down at one going by, catapults
  // in the floor, see-saws, escalators, spinning drums and rollers, and bars riding along slots in the track
  // pushing them on, so the pack takes different ways down. Since nothing is ever level without something pushing, and every dip has a hole
  // in it, there's always a way to the goal at the bottom.
  let K = null;
  const HOLE = 18;
  const yOn = (sp, x) => sp.ya + (sp.yb - sp.ya) * (x - sp.xa) / (sp.xb - sp.xa);
  function seg(ax, ay, bx, by, o = {}) {
    const s = Object.assign({ ax, ay, bx, by, e: 0.1, on: true, flow: 0 }, o);
    K.segs.push(s); return s;
  }
  // A span of sloping floor from (xa, ya) to (xb, yb); flow is the way it runs downhill. Each is built from
  // whatever was lying around: the Stunt Wheel's orange track, a red riveted girder, a steel coaster rail
  // on wooden ties, or a casino neon tube.
  const STYLES = { track: 5, girder: 2, rail: 1.6, neon: 1.2 };
  const span = (b, xa, ya, xb, yb) => ({ b, xa, ya, xb, yb, flow: yb > ya ? 1 : -1, marks: [], style: pickW(STYLES), neon: pick(['#ff3bd0', '#3ff8ff', '#ffe600']) });

  const KINDS = { rampR: 3, rampL: 3, peak: 2, valley: 1.5, dvalley: 1.3, pinball: 1.1, funnel: 1, pegs: 1.2 };
  function floorFor(kind, b) {
    const X0 = K.xl, X1 = K.xr, w = X1 - X0, lo = b.yB, hi = Math.min(b.yT + 14, lo - 6);
    const S = (xa, ya, xb, yb) => span(b, xa, ya, xb, yb);
    if (kind === 'rampR') return { spans: [S(X0, hi, X1 - HOLE, lo)], holes: [[X1 - HOLE, X1]] };
    if (kind === 'rampL') return { spans: [S(X0 + HOLE, lo, X1, hi)], holes: [[X0, X0 + HOLE]] };
    if (kind === 'peak') {
      if (w < 120) return null;
      const cx = Math.round(X0 + w * rnd(0.35, 0.65));
      return { spans: [S(X0 + HOLE, lo, cx, hi), S(cx, hi, X1 - HOLE, lo)], holes: [[X0, X0 + HOLE], [X1 - HOLE, X1]], peakX: cx };
    }
    if (kind === 'valley' || kind === 'pinball' || kind === 'funnel') {
      const hw = kind === 'pinball' ? 15 : kind === 'funnel' ? clamp(Math.round(w * 0.025), 9, 13) : HOLE / 2;
      const cx = Math.round(X0 + w * rnd(0.3, 0.7));
      let low = lo;
      if (kind === 'funnel') { low = lo - clamp(b.yB - b.yT - 26, 10, 16); if (low - hi < 6) return null; }
      if (kind === 'pinball' && w < 140) return null;
      return { spans: [S(X0, hi, cx - hw, low), S(cx + hw, low, X1, hi)], holes: [[cx - hw, cx + hw]], cx, hw, low };
    }
    if (kind === 'dvalley') {
      if (w < 220) return null;
      const h = HOLE / 2, c1 = Math.round(X0 + w * rnd(0.22, 0.34)), c2 = Math.round(X0 + w * rnd(0.66, 0.78)), m = Math.round((c1 + c2) / 2), pk = Math.round((hi + lo) / 2);
      return { spans: [S(X0, hi, c1 - h, lo), S(c1 + h, lo, m, pk), S(m, pk, c2 - h, lo), S(c2 + h, lo, X1, hi)], holes: [[c1 - h, c1 + h], [c2 - h, c2 + h]], peakX: m };
    }
    if (kind === 'pegs') return { spans: [], holes: [[X0, X1]] };
    return null;
  }
  // does this floor catch what drops through the holes above it?
  const covers = (spans, holes) => holes.every(([a, c]) => spans.some(s => s.xa <= a + 1 && s.xb >= c - 1));

  function build() {
    if (C3) { K = C3.build(); return; }   // (the 3D view's course: see course3d.js)
    const pw = Math.max(90, Math.round(W * CFG.width / 100) - 10);
    const xl = Math.round((W - pw) / 2), xr = xl + pw;
    K = { xl, xr, segs: [], circles: [], spans: [], bands: [], flippers: [], traps: [], bumpers: [], pegs: [], hops: [], slots: [], movs: [], drums: [], escs: [],
      lamps: [], pipes: [], grid: new Map(), startY: 22, slats: [], doorAng: 0, doorsOpen: false, rows: [] };
    seg(xl, -80, xl, H + 30, { e: 0.3, wall: true });
    seg(xr, -80, xr, H + 30, { e: 0.3, wall: true });
    // the starting shelf: a row of trapdoor slats, hinged on their left ends, that all drop open at GO
    const n = Math.max(2, Math.round(pw / 14)), sw = pw / n;
    for (let i = 0; i < n; i++) K.slats.push(seg(xl + i * sw, K.startY, xl + (i + 1) * sw, K.startY, { rest: true, slat: true }));

    // the floors: as many as fit at about 38 px each, a bit taller or shorter at random
    const y0 = K.startY + 4, y1 = H - 16, nb = clamp(Math.floor((y1 - y0) / 38), 1, 18);
    const wts = Array.from({ length: nb }, () => rnd(0.85, 1.2)), tw = wts.reduce((a, c) => a + c, 0);
    let y = y0, prev = null;
    for (let i = 0; i < nb; i++) {
      const bh = i === nb - 1 ? y1 - y : Math.round((y1 - y0) * wts[i] / tw);
      const b = { i, yT: y, yB: y + bh, last: i === nb - 1, hops: [], loops: [], pipes: [], funnels: [], doms: [], cones: [], slots: [], spans: [], flips: [] };
      y += bh;
      let fl = null, kind = '';
      for (let tries = 0; tries < 60 && !fl; tries++) {
        kind = pickW(KINDS);
        if (b.last && !/^ramp|^valley$/.test(kind)) continue;
        if (kind === 'pegs' && prev?.kind === 'pegs') continue;
        if (prev && kind === prev.kind && !kind.startsWith('ramp') && tries < 40) continue;
        const f = floorFor(kind, b);
        if (!f) continue;
        if (prev && prev.kind !== 'pegs' && tries < 50 && !covers(f.spans, prev.holes)) continue;
        fl = f;
      }
      if (!fl) { kind = prev?.holes.some(([a]) => a > (xl + xr) / 2) ? 'rampL' : 'rampR'; fl = floorFor(kind, b); }
      Object.assign(b, fl, { kind });
      b.spans = fl.spans;
      K.bands.push(b);
      prev = b;
    }
    const last = K.bands[K.bands.length - 1];
    K.goal = { xa: last.holes[0][0], xb: last.holes[0][1], y: last.kind === 'valley' ? last.low : last.yB };
    for (const x of [K.goal.xa, K.goal.xb]) if (x > xl + 1 && x < xr - 1) seg(x, K.goal.y, x, H + 30, { e: 0.2 });   // the goal cup's sides
    for (const b of K.bands) for (let yy = Math.max(0, b.yT); yy <= b.yB + 4; yy++) K.rows[yy] ??= b;

    // now everything along the floors
    for (const b of K.bands) {
      if (b.kind === 'pegs') pegField(b);
      if (b.kind === 'pinball') pinball(b);
      if (b.kind === 'funnel') b.funnels.push({ x: b.cx, R: b.hw, rimY: b.low, spoutY: b.yB, b });
      for (const sp of [...b.spans]) dress(sp);
      for (const sp of b.spans) K.spans.push(sp);
    }
    for (const P of K.pipes) aimPipe(P);
    K.pipes = K.pipes.filter(P => P.path);
    for (const P of K.pipes) P.b.pipes.push(P);
    placeSlots();
    placeCogs();
    for (const b of K.bands) for (const sp of b.spans) segsFor(sp);

    // the spatial grid: every solid thing is listed in each 16 px cell it's near
    for (const s of K.segs) {
      if (s.flip) { const F = s.flip; gridAdd(s, F.px - F.len, F.py - F.len, F.px + F.len, F.py + F.len); }
      else if (s.reach) gridAdd(s, ...s.reach);   // (a moving one: everywhere it goes)
      else gridAdd(s, Math.min(s.ax, s.bx), Math.min(s.ay, s.by), Math.max(s.ax, s.bx), Math.max(s.ay, s.by));
    }
    for (const c of K.circles) if (c.reach) gridAdd(c, ...c.reach); else gridAdd(c, c.x - c.r, c.y - c.r, c.x + c.r, c.y + c.r);
    K.art = bake(W, H, drawCourse);
    K.sky = CFG.scenery ? bake(W, H, drawSkyline) : null;
  }

  // A pop bumper floating over floor b at x, if there's room for wheels to roll under it and to bounce
  // over it, and it isn't right under a hole wheels drop through (f: the way the floor runs).
  function floatBumper(b, sp, x, f) {
    if (x < sp.xa + 4 || x > sp.xb - 4) return;
    const prev = K.bands[b.i - 1];
    if (prev && prev.holes.some(([a, c]) => x > a - 14 && x < c + 14)) return;
    const r = 4, lo = yOn(sp, x) - 2 * RW - 5 - r, hi = ceilAt(x, b) + 2 * RW + 4 + r;
    if (lo < hi) return;
    const c = { x, y: rnd(hi, lo), r, e: 0.6, kick: 110, kind: 'bumper', lit: 0, f };
    K.circles.push(c); K.bumpers.push(c);
  }

  // The height of whatever's overhead at x, above floor b: the floor above, or the starting shelf. Under a
  // hole it's the bottom of the floor above (where funnels' spouts and flippers hang down to), so nothing
  // that throws wheels up goes right where the ones dropping through come down.
  function ceilAt(x, b) {
    const o = K.bands[b.i - 1];
    if (!o) return K.startY + 2;
    const sp = o.spans.find(s => x >= s.xa - 2 && x <= s.xb + 2);
    return sp ? yOn(sp, clamp(x, sp.xa, sp.xb)) + 4 : o.yB + 6;
  }

  // A field of chrome pins, staggered like a pachinko board, with a few dice, poker chips and pop bumpers
  // among them. Nothing big sits next to anything else big, so a wheel always fits between.
  function pegField(b) {
    const sx = 16, sy = 12, big = [];
    for (let r = 0, y = b.yT + 10; y < b.yB - 4; r++, y += sy) {
      for (let x = K.xl + 11 + (r & 1 ? sx / 2 : 0); x < K.xr - 10; x += sx) {
        const roll = Math.random();
        let kind = roll < 0.07 ? 'bumper' : roll < 0.12 ? 'die' : roll < 0.17 ? 'chip' : 'peg';
        if (kind !== 'peg' && big.some(q => Math.hypot(q.x - x, q.y - y) < 34)) kind = 'peg';
        const jx = x + rnd(-1, 1);
        if (kind === 'peg') { const c = { x: jx, y, r: 1.5, e: 0.45 }; K.circles.push(c); K.pegs.push(c); continue; }
        const c = { x: jx, y, r: kind === 'bumper' ? 4 : 3.5, e: 0.5, kind, face: ri(1, 6), chip: pick(CHIP_COLS), lit: 0 };
        if (kind === 'bumper') { c.kick = 110; c.e = 0.6; K.bumpers.push(c); } else K.pegs.push(c);
        K.circles.push(c); big.push(c);
      }
    }
  }

  // A pinball drain: the valley's two slopes end in a pair of flippers hinged at the hole's edges, flicking
  // at random. The gap between their tips is always wide enough to drain through. A couple of pop bumpers
  // float over the slopes.
  function pinball(b) {
    for (const dir of [1, -1]) {
      flipper(b, b.cx - dir * b.hw, b.low, 10, dir > 0 ? 0.5 : Math.PI - 0.5, dir > 0 ? -1 : 1, { flow: dir });
    }
    for (const sp of b.spans) for (let k = ri(1, 2); k > 0; k--) floatBumper(b, sp, sp.xa + (sp.xb - sp.xa) * rnd(0.3, 0.75), sp.flow);
  }

  // A flipper hinged at (x, y), its arm `len` long at angle a0 at rest (on screen: 0 is right, down is
  // positive) and flicking round by `sweep`. With `zone` ([x0, y0, x1, y1]) it flicks when a wheel's in it.
  function flipper(b, x, y, len, a0, sweep, o = {}) {
    const F = { px: x, py: y, len, a0, sweep, ang: a0, k: 0, st: 0, next: o.zone ? rnd(3, 7) : rnd(0.5, 2), zone: o.zone, cool: 0, kind: o.kind || 'flipper' };
    F.seg = seg(x, y, x + len * Math.cos(a0), y + len * Math.sin(a0), { e: 0.3, flow: o.flow || 0, flip: F });
    K.flippers.push(F); b.flips.push(F);
    return F;
  }
  // (is x under one of the holes in the floor above, where wheels drop through?)
  const underHole = (b, x, m) => K.bands[b.i - 1]?.holes.some(([a, c]) => x > a - m && x < c + m);

  // ---- things along the floors ----
  const CHIP_COLS = [['#e8344e', '#a3203a'], ['#2f6bff', '#1d43a8'], ['#22b35e', '#147a3e'], ['#8a5cff', '#5a3aad'], ['#3a3450', '#1f1a2e']];
  const FEAT = { hop: 3, spring: 1.3, boost: 1.1, belt: 0.8, trap: 0.9, loop: 1.2, gap: 1.3, dominoes: 0.8, cones: 0.7, lamp: 0.6, pipe: 0.7, none: 2.2,
    spinner: 1.1, bat: 0.6, catapult: 0.7, seesaw: 0.6, escalator: 0.6, drum: 0.6, rollers: 0.6, pusher: 0.7, hump: 0.6, bridge: 0.6, rough: 0.9 };
  const HOPS = { die: [7, 7], chips: [8, 0], mush: [9, 9], kick: [9, 9] };
  function dress(sp) {
    const b = sp.b, f = sp.flow, L = sp.xb - sp.xa;
    const X = s => f > 0 ? sp.xa + s : sp.xb - s;
    // some long-enough spans are a flight of steps instead, and nothing else goes on them
    const drop = Math.abs(sp.yb - sp.ya);
    if (L > 50 && drop / 3.5 >= 4 && L / Math.floor(drop / 3.5) <= 40 && Math.random() < 0.16) { sp.stairs = Math.floor(drop / 3.5); return; }
    let s = ri(16, 28);
    for (let tries = 0; tries < 60; tries++) {
      const room = L - 16 - s;
      if (room < 14) break;
      const k = pickW(FEAT), x = X(s), y = yOn(sp, x);
      if (k === 'none') { s += ri(14, 40); continue; }
      if (k === 'hop') {
        const kind = pickW({ die: 2, chips: 2, mush: 1, kick: 1 });
        let [hw, hh] = HOPS[kind];
        const cols = kind === 'chips' ? Array.from({ length: ri(2, 4) }, () => pick(CHIP_COLS)) : null;
        if (cols) hh = 2 * cols.length + 1;
        if (room < hw + 30) continue;
        const hx = X(s + 6 + hw / 2), fy = yOn(sp, hx), top = Math.round(fy) - hh;
        if (fy - ceilAt(hx, b) < hh + 2 * RW + 8 || K.bumpers.some(c => Math.abs(c.x - hx) < hw / 2 + c.r + 2 * RW + 4 && c.y < fy && c.y > fy - 40)) { s += 10; continue; }
        const h = { kind, x: hx, hw, hh, top, fy, f, cols, face: ri(1, 6), lit: 0, b, near: hx - f * hw / 2 };
        const xa = hx - hw / 2, xb = hx + hw / 2;
        seg(xa, yOn(sp, xa), xa, top, { e: 0.3, box: h }); seg(xa, top, xb, top, { flow: f, box: h }); seg(xb, top, xb, yOn(sp, xb), { e: 0.3, box: h });
        b.hops.push(h); K.hops.push(h);
        s += hw + ri(26, 40);
      } else if (k === 'spring') {
        if (room < 50) continue;
        const rm = y - ceilAt(x, b) - 2 * RW - 4, prev = K.bands[b.i - 1];
        if (rm < 18 || prev?.holes.some(([a, c]) => x > a - 20 && x < c + 20)) { s += 10; continue; }
        const a = X(s + 2), c = X(s + 12);
        sp.marks.push({ a: Math.min(a, c), b: Math.max(a, c), spring: Math.sqrt(2 * G * rm) * 0.95 });
        // pop bumpers floating over the spot it throws them to
        if (Math.random() < 0.75) for (let j = 0, nn = ri(1, 3); j < nn; j++) floatBumper(b, sp, X(s + 18 + j * 13), f);
        s += ri(48, 60);
      } else if (k === 'boost') {
        const a = X(s), c = X(s + 14);
        sp.marks.push({ a: Math.min(a, c), b: Math.max(a, c), boost: true });
        s += 26;
      } else if (k === 'belt') {
        const len = Math.min(room - 6, ri(30, 64));
        if (len < 24) continue;
        const a = X(s), c = X(s + len);
        sp.marks.push({ a: Math.min(a, c), b: Math.max(a, c), belt: 95 });
        s += len + 10;
      } else if (k === 'trap') {
        if (b.last || K.traps.length >= 4 || room < 44) continue;
        const len = ri(18, 24), a = X(s), c = X(s + len);
        const T = { open: false, next: rnd(1, 5), ang: 0, f };
        sp.marks.push({ a: Math.min(a, c), b: Math.max(a, c), trap: T });
        K.traps.push(T);
        s += len + 18;
      } else if (k === 'loop') {
        const R = ri(9, 12);
        if (room < 2 * R + 30 || b.loops.length >= 2) continue;
        const cxL = X(s + 10 + R);
        let ok = true;
        for (let xx = cxL - R; xx <= cxL + R; xx += 2) if (yOn(sp, clamp(xx, sp.xa, sp.xb)) - ceilAt(xx, b) < 2 * R + 5) ok = false;
        if (!ok) { s += 12; continue; }
        const len = Math.hypot(sp.xb - sp.xa, sp.yb - sp.ya), tx = f * (sp.xb - sp.xa) / len, ty = f * (sp.yb - sp.ya) / len;
        b.loops.push({ x: cxL, y0: yOn(sp, cxL), R, f, tx, ty, sp, roulette: Math.random() < 0.5 });
        s += 2 * R + 30;
      } else if (k === 'gap') {
        // a gap only the faster wheels jump: its far side is a little lower, just enough to catch a wheel
        // going faster than `vt`; anything slower drops through to the floor below
        if (b.last || sp.gapped || room < 70) continue;
        const g = ri(12, 18), vt = rnd(55, 100), dy = clamp(G * g * g / (2 * vt * vt), 1.5, 6);
        const xg = X(s), xf = X(s + g), yf = yOn(sp, xf) + dy, yEnd = f > 0 ? sp.yb : sp.ya;
        if (yEnd - yf < Math.max(2, 0.03 * (L - s - g))) continue;

        const rest = f > 0 ? span(b, xf, yf, sp.xb, sp.yb) : span(b, sp.xa, sp.ya, xf, yf);

      } else if (k === 'dominoes') {

        b.doms.push({ ds, ys: ds.map(xx => yOn(sp, xx)), f, start: -1, sp });
        s += nn * 4 + 18;
      } else if (k === 'cones') {
        const nn = ri(2, 4);

        b.cones.push({ f, sp, cs: Array.from({ length: nn }, (_, i) => { const xx = X(s + 6 + i * 9); return { x: xx, y: yOn(sp, xx), hit: false }; }) });
        s += nn * 9 + 14;
      } else if (k === 'lamp') {
        if (y - ceilAt(x, b) < 22) { s += 8; continue; }

      } else if (k === 'spinner') {

        // the wheels and batting them on
        const L = 9, cx = X(s + L + 4), fy = yOn(sp, cx), cy = fy - L - 2.5;
        if (room < 2 * L + 20 || cy - L - ceilAt(cx, b) < 2 || underHole(b, cx, L + 6)) { s += 10; continue; }
        const n = pick([2, 3, 4, 6]), M = { type: 'spin', x: cx, y: cy, L, n, th: rnd(0, 6.283), w: -f * (n > 4 ? rnd(1.2, 1.5) : rnd(1.4, 1.8)), segs: [] };   // (turning slowly: nothing flickers)
        for (let j = 0; j < M.n; j++) M.segs.push(seg(cx, cy, cx, cy, { e: 0.5, reach: [cx - L, cy - L, cx + L, cy + L] }));

      } else if (k === 'bat') {

        const La = 12, cx = X(s + 18), fy = yOn(sp, cx), cy = fy - La - 3;

        const len = 12, xp = X(s + len + 2), yp = yOn(sp, xp) - 1, fx = sp.xb - sp.xa, fyv = sp.yb - sp.ya;
        if (room < 40 || yp - ceilAt(xp, b) < 30) { s += 10; continue; }

      } else if (k === 'seesaw') {

        // drops them off the far end. While the near end's up, a board under it keeps them from rolling under.
        const L = 40, hp = 4, cx = X(s + L / 2 + 3), fy = yOn(sp, cx), cy = fy - hp;
        if (room < L + 26 || cy - 2 * hp - ceilAt(cx, b) < 2 * RW + 6 || underHole(b, cx, L / 2)) { s += 10; continue; }
        const beta = Math.atan2(sp.yb - sp.ya, sp.xb - sp.xa), delta = Math.asin(clamp(2 * hp * Math.cos(beta) / L, 0, 1));
        const reach = [cx - L / 2 - 2, cy - L / 2, cx + L / 2 + 2, fy + 2];

        const run = 26, rise = 10, land = 8, x0 = X(s), x1 = X(s + run), x2 = X(s + run + land), y0 = yOn(sp, x0), top = y0 - rise;
        if (room < run + land + 24 || top - Math.max(ceilAt(x0, b), ceilAt(x1, b), ceilAt(x2, b)) < 2 * RW + 6 || underHole(b, (x0 + x2) / 2, 20)) { s += 10; continue; }

        const r = 6, cx = X(s + r + 3), cy = yOn(sp, cx) - r + 0.5;

  // A glass pipe from a mouth in one floor down to a floor two or three further on, where it lets the
  // wheel out rolling the way that floor runs. Wheels that roll over the mouth go in about half the time.
  function aimPipe(P) {
    const tb = K.bands[Math.min(K.bands.length - 1, P.b.i + (Math.random() < 0.5 ? 2 : 3))];
    const cands = tb.spans.filter(sp => sp.xb - sp.xa > 50 && !sp.stairs);
    if (!cands.length) return;
    const sp = pick(cands), f = sp.flow, L = sp.xb - sp.xa;
    const tx = f > 0 ? sp.xa + rnd(10, Math.min(L - 30, 120)) : sp.xb - rnd(10, Math.min(L - 30, 120)), ty = yOn(sp, tx) - RW - 1;
    const P0 = [P.x, P.y0 - RW], P3 = [tx, ty], P1 = [P.x + P.f * 6, P.y0 + 26], P2 = [tx - f * 34, ty - 4];
    const pts = [];
    for (let i = 0; i <= 40; i++) {
      const t = i / 40, u = 1 - t, q = j => u * u * u * P0[j] + 3 * u * u * t * P1[j] + 3 * u * t * t * P2[j] + t * t * t * P3[j];
      pts.push([q(0), q(1)]);
    }
    if (pts.some(([x]) => x < K.xl + RW + 1 || x > K.xr - RW - 1)) return;
    let s = 0;
    P.path = pts.map((q, i) => ({ x: q[0], y: q[1], s: i ? (s += Math.hypot(q[0] - pts[i - 1][0], q[1] - pts[i - 1][1])) : 0 }));
    P.to = tb;
  }

  // Slot machines stand behind a floor or two; a wheel rolling past spins their reels, and sometimes it's 7-7-7.
  const SYMS = ['seven', 'cherry', 'bell', 'diamond'];
  function placeSlots() {
    const cands = K.bands.filter(b => !b.last && b.spans.length && b.yB - b.yT >= 34);
    for (let n = Math.min(cands.length, ri(0, 2)); n > 0; n--) {
      const b = cands.splice(ri(0, cands.length - 1), 1)[0], sp = pick(b.spans);
      if (sp.xb - sp.xa < 60) continue;
      const x = rnd(sp.xa + 22, sp.xb - 22);
      const S = { x: Math.round(x), base: Math.round(yOn(sp, x)) + 3, payAt: 0, won: -9, b, reels: [0, 1, 2].map(() => ({ s: ri(0, 3), until: 0 })) };
      K.slots.push(S); b.slots.push(S);
    }
  }
  function spinSlots(S) {
    if (S.reels.some(r => r.until > simT)) return;
    const jackpot = Math.random() < 0.18;
    S.reels.forEach((r, i) => { r.until = simT + 0.5 + i * 0.35; r.s = jackpot ? 0 : ri(0, SYMS.length - 1); });
    if (!jackpot && S.reels.every(r => r.s === 0)) S.reels[2].s = 1;
    if (jackpot) S.payAt = S.reels[2].until;
  }

  // Gears turning behind the machine, most of them meshed with a smaller one turning the other way.
  function placeCogs() {
    K.cogs = [];
    for (let n = Math.round(W * H / 30000); n > 0; n--) {
      const r = ri(6, 13), col = pick(['#4a4660', '#5a4a3a', '#3a4a5a']);
      const g = { x: rnd(K.xl + r + 2, K.xr - r - 2), y: rnd(K.startY + 24, H - 30), r, sp: pick([-1, 1]) * rnd(0.3, 0.8), ph: rnd(0, 6.3), col };
      K.cogs.push(g);
      if (Math.random() < 0.65) {
        const r2 = ri(4, 8), a = rnd(0, 6.3), d = r + r2 + 1.5;
        K.cogs.push({ x: g.x + Math.cos(a) * d, y: g.y + Math.sin(a) * d, r: r2, sp: -g.sp * r / r2, ph: rnd(0, 6.3), col });
      }
    }
    for (const g of K.cogs) Object.assign(g, { teeth: Math.max(5, Math.round(g.r * 0.8)), lit: shade(g.col, 0.25), dk: shade(g.col, -0.3) });
  }
  function drawCogs(t) {
    ctx.globalAlpha = 0.75;
    for (const g of K.cogs) drawCog(g, Math.round(g.x), Math.round(g.y), g.ph + t * g.sp);
    ctx.globalAlpha = 1;
  }
  function drawCog(g, cx, cy, rot) {
    const T = 2 * Math.PI, R = g.r;

      const d = Math.hypot(dx, dy);

      const a = Math.atan2(dy, dx) - rot, f = ((a / T * g.teeth) % 1 + 1) % 1;
      if (d > R - 0.4 && Math.min(f, 1 - f) > 0.25) continue;                     // between the teeth

      px(cx + dx, cy + dy, d < 1.5 ? '#8a8aa0' : d > R - 1.6 ? (dy < 0 ? g.lit : g.dk) : g.col);
    }
  }

  // Turns a span (and the springs, boost pads, belts and trapdoors marked along it) into solid segments.
  function segsFor(sp) {
    const f = sp.flow;

      const n = sp.stairs, L = sp.xb - sp.xa, tread = L / n, y0 = f > 0 ? sp.ya : sp.yb, rise = Math.abs(sp.yb - sp.ya) / n;
      sp.steps = [];

        const a = f > 0 ? sp.xa + k * tread : sp.xb - k * tread, c = f > 0 ? a + tread : a - tread, yy = y0 + k * rise;
        seg(Math.min(a, c), yy, Math.max(a, c), yy, { flow: f, sp });
        if (k < n - 1) seg(c, yy, c, yy + rise, { e: 0.2, riser: true });
        sp.steps.push({ a: Math.min(a, c), c: Math.max(a, c), y: yy, edge: c });
      }
      return;
    }

    for (const m of sp.marks) cuts.push(m.a, m.b);
    const xs = [...new Set(cuts.map(v => Math.round(v * 100) / 100))].sort((a, c) => a - c);
    for (let i = 0; i < xs.length - 1; i++) {
      const a = xs[i], c = xs[i + 1];

      const m = sp.marks.find(q => q.a <= a + 0.01 && q.b >= c - 0.01) || {};
      if (m.bridge) {   // (a plank every 4 px or so, each moved by the bridge, and listed everywhere it can go)
        const B = m.bridge, n = Math.max(2, Math.round((c - a) / 4));

        }

      }
      const s = seg(a, yOn(sp, a), c, yOn(sp, c), { flow: f, sp, spring: m.spring, boost: m.boost, belt: m.belt, trap: m.trap, rough: m.rough });
      if (m.trap) m.trap.seg = s;

  }

  // ---------------- physics ----------------
  const CELL = 16;
  const cellKey = (cx, cy) => (cy + 64) * 4096 + cx + 64;
  function gridAdd(o, x0, y0, x1, y1) {
    for (let cy = Math.floor((y0 - RW - 2) / CELL); cy <= Math.floor((y1 + RW + 2) / CELL); cy++)
      for (let cx = Math.floor((x0 - RW - 2) / CELL); cx <= Math.floor((x1 + RW + 2) / CELL); cx++) {
        const k = cellKey(cx, cy); let a = K.grid.get(k); if (!a) K.grid.set(k, a = []); a.push(o);
      }
  }
  const near = (x, y) => K.grid.get(cellKey(Math.floor(x / CELL), Math.floor(y / CELL))) || [];

  // Rolling: a wheel on the track always rolls downhill at least MINV (and up to a belt's speed on a
  // conveyor), so even gentle slopes keep the pack moving, and anything faster eases back down to it.
  function moveFree(w, dt) {
    w.px = w.x; w.py = w.y;
    const c = w.contact; w.contact = null;
    w.vy += G * dt;
    if (c) {
      if (c.s.rest) w.vx *= 1 - 4 * dt;
      else if (c.s.rough) { w.vx *= 1 - 1.2 * dt; if (Math.random() < 5 * dt) { w.vy -= rnd(20, 45); nudgeZ(w, 20); } }
      else {
        const vt = w.vx * c.tx + w.vy * c.ty, want = c.s.belt || MINV;
        if (vt < want) { const a = Math.min(want - vt, (c.s.belt ? 500 : 260) * dt); w.vx += c.tx * a; w.vy += c.ty * a; }
        else if (vt > MINV + 20) { const a = (vt - MINV) * 0.35 * dt; w.vx -= c.tx * a; w.vy -= c.ty * a; }
      }
    }
    const sp = Math.hypot(w.vx, w.vy);
    if (sp > VMAX) { w.vx *= VMAX / sp; w.vy *= VMAX / sp; }
    w.x += w.vx * dt; w.y += w.vy * dt; w.rot += w.vx * dt / RW;
    if (DEPTH) {   // across the channel, slowing as it rolls, and bouncing off its sides
      w.z += w.vz * dt;
      if (c) w.vz *= 1 - 1.5 * dt;
      if (Math.abs(w.z) > ZB) { w.z = Math.sign(w.z) * ZB; w.vz *= -0.5; }
    }
  }
  const nudgeZ = (w, k) => { if (DEPTH) w.vz += rnd(-k, k); };

  // Wheels bump into each other (gently: a pile never shoves one through the floor).
  function pairs(ws) {
    for (let i = 0; i < ws.length; i++) {
      const a = ws[i]; if (a.mode !== 'free') continue;
      for (let j = i + 1; j < ws.length; j++) {
        const b = ws[j]; if (b.mode !== 'free') continue;
        const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;   // (dz is 0 in 2D)
        if (dx > 8 || dx < -8 || dy > 8 || dy < -8) continue;
        const d2 = dx * dx + dy * dy + dz * dz; if (d2 >= 64 || d2 < 1e-6) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, nz = dz / d, push = Math.min(1.2, (8 - d) / 2);

  function fireworks(dt) {
